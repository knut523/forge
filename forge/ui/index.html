<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forge — code index</title>
<style>
  :root{
    --bg:#0e1013; --panel:#161a20; --panel2:#1c222a; --line:#272e38;
    --ink:#e6e9ee; --ink2:#9aa4b2; --ink3:#6b7684;
    --accent:#f0883e;
    --hi:#3fb950; --med:#d29922; --lo:#8b949e;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  /* Grid and flex children default to min-width:auto, so one long file path or
     wide table stretches its whole column and the page scrolls sideways.
     Everything that lays out children opts them back out of that. */
  .split>*,.grid>*,.item>*,.row>*,.ev2>*,.link>*,.runrow>*{min-width:0}
  a{color:var(--accent);text-decoration:none}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;
         border-bottom:1px solid var(--line);background:var(--panel);
         position:sticky;top:0;z-index:10}
  .logo{width:26px;height:26px;border-radius:7px;flex:none;
        background:linear-gradient(135deg,var(--accent),#b85c1d);
        display:grid;place-items:center;font-weight:700;color:#1a1005;font-size:15px}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .sub{color:var(--ink3);font-size:12px}
  nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid transparent;color:var(--ink2);
    padding:6px 13px;border-radius:7px;cursor:pointer;font-size:13px;font-family:inherit}
  nav button:hover{color:var(--ink);background:var(--panel2)}
  nav button.on{background:var(--panel2);color:var(--ink);border-color:var(--line)}
  main{padding:20px;max-width:1080px;margin:0 auto;width:100%}
  .grid{display:grid;gap:14px;
        grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:600}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}
  .kv span:first-child{color:var(--ink3)}
  .kv span:last-child{font-family:var(--mono);font-size:12px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:9px 12px;border-radius:8px;font:inherit;font-size:13px;max-width:100%}
  input{flex:1 1 180px;min-width:0}
  select{flex:0 1 auto;min-width:0}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  button.go{background:var(--accent);color:#1a1005;border:none;padding:9px 17px;
    border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}
  button.go:hover{filter:brightness(1.1)}
  .list{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .item{padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer;
        display:flex;gap:11px;align-items:baseline}
  .item:last-child{border-bottom:none}
  .item:hover{background:var(--panel2)}
  .kind{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);
        border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex:none}
  .qn{font-family:var(--mono);font-size:13px;color:var(--ink)}
  .loc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);
       text-align:right;flex:0 1 auto;max-width:38%;overflow-wrap:anywhere}
  .sig{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;
         border-radius:20px;text-transform:uppercase}
  .b-high{background:rgba(63,185,80,.15);color:var(--hi);border:1px solid rgba(63,185,80,.3)}
  .b-medium{background:rgba(210,153,34,.15);color:var(--med);border:1px solid rgba(210,153,34,.3)}
  .b-low{background:rgba(139,148,158,.13);color:var(--lo);border:1px solid rgba(139,148,158,.28)}
  .ev{font-family:var(--mono);font-size:12px;padding:8px 14px;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:none}
  .ev .p{color:var(--ink2)}
  .ev .arrow{color:var(--accent)}
  .muted{color:var(--ink3)}
  .note{background:rgba(240,136,62,.08);border:1px solid rgba(240,136,62,.25);
        color:#e8b48a;padding:10px 13px;border-radius:9px;font-size:13px;margin-top:12px}
  .sec{margin:22px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;
       color:var(--ink3);font-weight:600}
  .link{display:flex;align-items:center;gap:10px;padding:10px 15px;
        border-bottom:1px solid var(--line);font-size:13px}
  .link:last-child{border-bottom:none}
  .link code{font-family:var(--mono);color:var(--ink)}
  .bar{height:5px;border-radius:3px;background:var(--accent);flex:none}
  .empty{padding:30px;text-align:center;color:var(--ink3)}
  .spin{padding:22px;text-align:center;color:var(--ink3);font-size:13px}
  .hint{font-size:12px;color:var(--ink3);margin-top:-6px;margin-bottom:12px}

  /* ── coder view ───────────────────────────────────────────── */
  .split{display:grid;gap:16px;grid-template-columns:270px 1fr;align-items:start}
  @media(max-width:860px){.split{grid-template-columns:1fr}}
  .runrow{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:9px}
  .runrow:last-child{border-bottom:none}
  .runrow:hover{background:var(--panel2)}
  .runrow.sel{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
  .d-running{background:var(--accent);animation:pulse 1.4s infinite}
  .d-complete{background:var(--hi)} .d-done{background:var(--hi)}
  .d-incomplete{background:var(--med)} .d-blocked{background:var(--accent)}
  .d-failed{background:#f85149} .d-queued{background:var(--ink3)}
  .blocker{border:1px solid rgba(240,136,62,.35);background:rgba(240,136,62,.08);
           border-radius:10px;padding:13px 15px;margin-bottom:14px}
  .blocker .bt{font-size:13px;color:#e8b48a;line-height:1.5}
  .blocker .ba{font-size:12.5px;color:var(--ink2);margin-top:7px;
               padding-top:7px;border-top:1px solid rgba(240,136,62,.22)}
  .blocker .ba b{color:var(--accent)}
  .d-awaiting_approval{background:var(--accent)} .d-rejected{background:var(--ink3)}
  .gate{border:1px solid rgba(63,185,80,.32);background:rgba(63,185,80,.07);
        border-radius:10px;padding:13px 15px;margin-bottom:14px}
  .gate .gt{font-size:13px;color:var(--ink);line-height:1.5}
  .gate code{font-family:var(--mono);color:var(--hi)}
  .subnav{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);
          border-radius:9px;margin-bottom:16px;width:fit-content;max-width:100%;flex-wrap:wrap}
  .subnav button{background:transparent;border:none;color:var(--ink3);padding:6px 15px;
                 border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
  .subnav button:hover{color:var(--ink)}
  .subnav button.on{background:var(--panel2);color:var(--ink)}
  .mem{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
  .mem:last-child{border-bottom:none}
  .mem .mk{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;padding:3px 7px;
           border-radius:5px;flex:none;margin-top:1px}
  .mk-gotcha{background:rgba(248,81,73,.14);color:#f85149}
  .mk-lesson{background:rgba(240,136,62,.14);color:var(--accent)}
  .mk-convention{background:rgba(63,185,80,.13);color:var(--hi)}
  .mk-decision{background:rgba(139,148,158,.14);color:var(--lo)}
  .mem .mb{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.5}
  .mem .mx{margin-left:auto;flex:none;display:flex;gap:8px;align-items:center}
  .srcpill{font-size:10px;color:var(--ink3);font-family:var(--mono)}
  .xbtn{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 4px}
  .xbtn:hover{color:#f85149}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .rg{font-size:12.5px;line-height:1.35;overflow:hidden;display:-webkit-box;
      -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .rmeta{font-size:10.5px;color:var(--ink3);font-family:var(--mono);margin-top:3px}

  .stepper{display:flex;gap:0;overflow-x:auto;padding:2px 0 10px}
  .stp{flex:1;min-width:84px;text-align:center;position:relative;padding-top:20px}
  .stp:before{content:'';position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
  .stp:first-child:before{left:50%} .stp:last-child:before{right:50%}
  .stp i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:12px;height:12px;
         border-radius:50%;background:var(--panel);border:2px solid var(--line)}
  .stp.on i{border-color:var(--accent);background:var(--accent);animation:pulse 1.4s infinite}
  .stp.ok i{border-color:var(--hi);background:var(--hi)}
  .stp span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
  .stp.on span{color:var(--accent);font-weight:700}
  .stp.ok span{color:var(--ink2)}
  .stp.future{opacity:.42}
  .stp.future span:after{content:' ·';}

  .now{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--panel2);
       border:1px solid var(--line);border-radius:10px;margin-bottom:14px;font-size:14px}
  .now b{font-weight:600}
  .phgroup{margin-bottom:6px}
  .phhdr{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink3);
         padding:11px 4px 6px;font-weight:700}
  .ev2{display:flex;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);
       align-items:flex-start;cursor:pointer}
  .ev2:last-child{border-bottom:none}
  .ev2:hover{background:var(--panel2)}
  .ev2 .gl{width:16px;text-align:center;flex:none;font-size:13px;line-height:1.5}
  .ev2 .tt{font-size:13px;line-height:1.45}
  .ev2 .pv{font-size:11.5px;color:var(--ink3);font-family:var(--mono);margin-top:2px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .ev2 .tm{margin-left:auto;font-size:10.5px;color:var(--ink3);font-family:var(--mono);flex:none}
  .ev2.lv-warn{background:rgba(210,153,34,.06)}
  .ev2.lv-error{background:rgba(248,81,73,.07)}
  .body{padding:2px 13px 14px 39px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .body pre{margin:0;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;
            word-break:break-word;color:var(--ink2);max-height:420px;overflow:auto}
  .body table{border-collapse:collapse;font-size:11.5px;font-family:var(--mono);
              width:100%;table-layout:fixed}
  .body td{padding:3px 10px 3px 0;vertical-align:top;color:var(--ink2);
           border-bottom:1px solid var(--line);overflow-wrap:anywhere}
  .body td:first-child{color:var(--ink3);width:30%}
  .body pre{max-width:100%}
  .prose{font-family:ui-sans-serif,system-ui;font-size:13px;line-height:1.6;color:var(--ink);
         white-space:pre-wrap}
  .chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .chip{font-size:11.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
        color:var(--ink2);cursor:pointer;background:transparent;font-family:inherit}
  .chip.on{background:var(--panel2);color:var(--ink);border-color:var(--accent)}

  /* Long identifiers, paths and URLs break rather than widen their container. */
  .qn,.tt,.rg,.prose,.bt,.sec,.kv span:last-child,.link code,h1,h3{overflow-wrap:anywhere}
  .stepper{max-width:100%}
  pre,code{overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="logo">f</div>
  <div>
    <h1>forge</h1>
    <div class="sub" id="hdr">code index &amp; cross-repo wayfinder</div>
  </div>
  <nav>
    <button data-tab="coder" class="on">Coder</button>
    <button data-tab="code">Code</button>
    <button data-tab="prs">PRs</button>
    <button data-tab="memory">Memory</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>
<main>
  <div id="coder"></div>
  <div id="code" hidden>
    <div class="subnav">
      <button data-sub="repos" class="on">Overview</button>
      <button data-sub="explore">Search</button>
      <button data-sub="wayfinder">Impact</button>
    </div>
    <div id="repos"></div>
    <div id="explore" hidden></div>
    <div id="wayfinder" hidden></div>
  </div>
  <div id="prs" hidden></div>
  <div id="memory" hidden></div>
  <div id="settings" hidden></div>
</main>

<script>
const API = new URL('api/', document.baseURI).href.replace(/\/+$/, '');
const $  = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc= (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num= (n)=>Number(n??0).toLocaleString();

async function get(p, q={}){
  const u = new URL(API+p, location.href);
  Object.entries(q).forEach(([k,v])=>{ if(v!=null && v!=='') u.searchParams.set(k,v); });
  const r = await fetch(u);
  if(!r.ok){ throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail); }
  return r.json();
}

let REPOS = [];

/* ── tabs ─────────────────────────────────────────────────────────── */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['coder','code','prs','memory','settings'].forEach(t=>$('#'+t).hidden = (t!==b.dataset.tab));
  if(b.dataset.tab==='settings') loadSettings();
  if(b.dataset.tab==='coder') loadRuns();
  if(b.dataset.tab==='prs') loadPRs();
  if(b.dataset.tab==='memory') loadMemory();
});
document.querySelectorAll('.subnav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.subnav button').forEach(x=>x.classList.toggle('on',x===b));
  ['repos','explore','wayfinder'].forEach(t=>$('#'+t).hidden = (t!==b.dataset.sub));
  if(b.dataset.sub==='explore') $('#q')?.focus();
});

/* ── repos ────────────────────────────────────────────────────────── */
async function loadRepos(){
  const box = $('#repos');
  box.innerHTML = '<div class="spin">loading index…</div>';
  try{
    REPOS = await get('/repos');
    if(!REPOS.length){ box.innerHTML='<div class="empty">Nothing indexed yet.</div>'; return; }
    $('#hdr').textContent = REPOS.length+' repo'+(REPOS.length>1?'s':'')+' indexed';
    box.innerHTML = '<div class="sec">Indexed repositories</div><div class="grid" id="rg"></div>';
    REPOS.forEach(r=>$('#rg').appendChild(el(`
      <div class="card">
        <h3>${esc(r.name)}</h3>
        <div class="kv"><span>files</span><span>${num(r.file_count)}</span></div>
        <div class="kv"><span>symbols</span><span>${num(r.symbol_count)}</span></div>
        <div class="kv"><span>edges</span><span>${num(r.ref_count)}</span></div>
        <div class="kv"><span>resolved</span><span>${r.resolved_pct}%</span></div>
        <div class="kv"><span>branch</span><span>${esc(r.branch||'—')}</span></div>
        <div class="kv"><span>indexed</span><span>${esc((r.indexed_at||'').replace('T',' ').replace('+00:00',''))}</span></div>
      </div>`)));

    const links = await get('/links');
    box.appendChild(el('<div class="sec">Cross-repo coupling &mdash; shared URL routes</div>'));
    if(!links.length){
      box.appendChild(el('<div class="list"><div class="empty">No route coupling found between the indexed repos.</div></div>'));
      return;
    }
    const max = Math.max(...links.map(l=>l.routes));
    const list = el('<div class="list"></div>');
    links.forEach(l=>list.appendChild(el(`
      <div class="link">
        <code>${esc(l.from)}</code> <span class="muted">&rarr;</span> <code>${esc(l.to)}</code>
        <div class="bar" style="width:${Math.round(110*l.routes/max)}px"></div>
        <span class="muted">${l.routes} matching paths</span>
        <span class="badge b-high" style="margin-left:auto">${l.high} high</span>
      </div>`)));
    box.appendChild(list);
  }catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ── explore ──────────────────────────────────────────────────────── */
function repoOptions(all='every repo'){
  return `<option value="">${all}</option>` +
    REPOS.map(r=>`<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
}

function exploreShell(){
  $('#explore').innerHTML = `
    <div class="row">
      <input id="q" placeholder="search symbols — name, signature or doc…" autocomplete="off">
      <select id="qrepo">${repoOptions()}</select>
      <button class="go" id="qgo">Search</button>
    </div>
    <div class="hint">Click a result to see who calls it and what it reaches.</div>
    <div id="qres"></div>
    <div id="detail"></div>`;
  $('#qgo').onclick = runSearch;
  $('#q').onkeydown = e=>{ if(e.key==='Enter') runSearch(); };
}

async function runSearch(){
  const q = $('#q').value.trim(); if(!q) return;
  const res = $('#qres'); $('#detail').innerHTML='';
  res.innerHTML = '<div class="spin">searching…</div>';
  try{
    const rows = await get('/search', {q, repo:$('#qrepo').value, limit:30});
    if(!rows.length){ res.innerHTML='<div class="list"><div class="empty">No match.</div></div>'; return; }
    const list = el('<div class="list"></div>');
    rows.forEach(r=>{
      const it = el(`<div class="item">
          <span class="kind">${esc(r.kind)}</span>
          <div style="min-width:0;flex:1">
            <div class="qn">${esc(r.qualname)}</div>
            <div class="sig">${esc(r.signature||'')}</div>
          </div>
          <div class="loc">${esc(r.path)}<br>:${r.start_line}</div>
        </div>`);
      it.onclick = ()=>showSymbol(r);
      list.appendChild(it);
    });
    res.innerHTML=''; res.appendChild(list);
  }catch(e){ res.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function showSymbol(sym){
  const d = $('#detail');
  d.innerHTML = '<div class="spin">reading graph…</div>';
  try{
    const [cr, ce, bl] = await Promise.all([
      get('/callers',{id:sym.id}), get('/callees',{id:sym.id}), get('/blast',{id:sym.id,depth:2})
    ]);
    d.innerHTML = `<div class="sec">${esc(sym.qualname)} &mdash; ${esc(sym.path)}:${sym.start_line}</div>`;
    const wrap = el('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"></div>');

    const mk = (title, rows, fmt) => {
      const c = el(`<div class="card"><h3>${title} <span class="muted">(${rows.length})</span></h3></div>`);
      if(!rows.length) c.appendChild(el('<div class="muted">none</div>'));
      rows.slice(0,25).forEach(r=>c.appendChild(el(`<div class="ev" style="border:none;padding:5px 0">${fmt(r)}</div>`)));
      return c;
    };
    wrap.appendChild(mk('Called by', cr,
      r=>`<span class="p">${esc(r.caller||'(module level)')}</span><br><span class="muted">${esc(r.path)}:${r.line}</span>`));
    wrap.appendChild(mk('Calls', ce,
      r=>`<span class="p">${esc(r.qualname)}</span><br><span class="muted">${esc(r.path)}:${r.start_line}</span>`));
    const flat = bl.layers.flat();
    wrap.appendChild(mk('Blast radius (depth 2)', flat,
      r=>`<span class="p">${esc(r.qualname)}</span><br><span class="muted">${esc(r.path)}:${r.start_line}</span>`));
    d.appendChild(wrap);
    if(bl.truncated) d.appendChild(el('<div class="note">Blast radius truncated — this is a hub symbol.</div>'));
  }catch(e){ d.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ── wayfinder ────────────────────────────────────────────────────── */
function wayShell(){
  $('#wayfinder').innerHTML = `
    <div class="row">
      <select id="wrepo">${REPOS.map(r=>`<option>${esc(r.name)}</option>`).join('')}</select>
      <input id="wtarget" placeholder="symbol name, or a file path" autocomplete="off">
      <select id="wmode"><option value="symbol">symbol</option><option value="path">file</option></select>
      <button class="go" id="wgo">Check impact</button>
    </div>
    <div class="hint">Run this before planning a change: it looks for impact in every other indexed repo, not just this one.</div>
    <div id="wres"></div>`;
  $('#wgo').onclick = runWay;
  $('#wtarget').onkeydown = e=>{ if(e.key==='Enter') runWay(); };
}

async function runWay(){
  const t = $('#wtarget').value.trim(); if(!t) return;
  const box = $('#wres');
  box.innerHTML = '<div class="spin">tracing…</div>';
  try{
    const mode = $('#wmode').value;
    const rep = await get('/impacts', {repo:$('#wrepo').value, [mode]:t});
    const tg = rep.target;
    box.innerHTML = '';
    box.appendChild(el(`<div class="card">

            : `<span class="p">${esc(i.name)}</span> <span class="muted">— ${esc(i.what)}</span>`;

/* ── coder: runs ──────────────────────────────────────────────────── */
const GLYPH = {step:['▸','var(--accent)'], metric:['▦','var(--ink2)'], finding:['◆','var(--accent)'],
  impact:['⚡','var(--med)'], warn:['▲','var(--med)'], error:['✕','#f85149'],
  plan:['▤','var(--accent)'], done:['✓','var(--hi)'], info:['·','var(--ink3)'],
  diff:['±','var(--accent)'], file:['▸','var(--ink2)']};
let PHASES = [], EPHASES = [], CUR = null, POLL = null, SEEN = 0, EVENTS = [],
    FILTER = 'all', ITEMS = null;

function flat(v){
  if(v==null) return '';
  if(typeof v === 'string') return v;
  if(typeof v !== 'object') return String(v);
  if(Array.isArray(v)) return v.map(flat).join(', ');
  return Object.entries(v).map(([k,x])=>`${k}=${flat(x)}`).join('  ');
}
function preview(d){
  if(d==null) return '';
  if(d.text) return String(d.text).split('\n').find(l=>l.trim()) || '';
  if(Array.isArray(d)) return d.length ? `${d.length} × ${flat(d[0]).slice(0,90)}` : '';
  return flat(d).slice(0,160);
}
function body(d){
  if(d==null) return '';
  if(d.text && /^(---|\+\+\+|@@|diff )/m.test(d.text)){
    const html = d.text.split('\n').map(l=>{
      const c = l.startsWith('+') && !l.startsWith('+++') ? 'var(--hi)'
              : l.startsWith('-') && !l.startsWith('---') ? '#f85149'
              : l.startsWith('@@') ? 'var(--accent)' : 'var(--ink3)';
      return `<span style="color:${c}">${esc(l)}</span>`;
    }).join('\n');
    return `<pre>${html}</pre>`;
  }
  if(d.text){
    const rest = Object.entries(d).filter(([k])=>k!=='text');
    return `<div class="prose">${esc(d.text)}</div>` +
      (rest.length?`<table style="margin-top:10px">${rest.map(([k,v])=>
        `<tr><td>${esc(k)}</td><td>${esc(flat(v))}</td></tr>`).join('')}</table>`:'');
  }
  if(Array.isArray(d)){
    if(!d.length) return '<span class="muted">empty</span>';
    if(typeof d[0] === 'object'){
      const cols = [...new Set(d.flatMap(o=>Object.keys(o||{})))];
      return `<table><tr>${cols.map(c=>`<td style="color:var(--ink3)">${esc(c)}</td>`).join('')}</tr>`
        + d.slice(0,60).map(o=>`<tr>${cols.map(c=>`<td>${esc(flat(o?.[c]))}</td>`).join('')}</tr>`).join('')
        + `</table>${d.length>60?`<div class="muted" style="margin-top:6px">…${d.length-60} more</div>`:''}`;
    }
    return `<pre>${esc(d.join('\n'))}</pre>`;
  }
  return `<table>${Object.entries(d).map(([k,v])=>
    `<tr><td>${esc(k)}</td><td>${typeof v==='object'&&v!==null
      ? `<pre>${esc(JSON.stringify(v,null,2))}</pre>` : esc(flat(v))}</td></tr>`).join('')}</table>`;
}

async function startEpic(){
  const goal = $('#fgoal').value.trim();
  const repos = [...document.querySelectorAll('.frepo:checked')].map(c=>c.value);
  if(!goal) return;
  if(!repos.length){ alert('pick at least one repo the feature may touch'); return; }
  const btn = $('#fgo'); btn.disabled = true; btn.textContent = 'framing…';
  try{
    const r = await send('POST','/epics',{goal, repos});
    $('#fgoal').value='';
    await loadRuns(); openRun(r.id);
  }catch(e){ alert(e.message); }
  finally{ btn.disabled=false; btn.textContent='Plan the split'; }
}

function itemsPanel(items){
  if(!items?.length) return '';
  const rows = items.map(it=>{
    const a = it.assessment || {};
    const v = a.verdict || {};
    const probs = a.problems || [];
    const bad = probs.length || (v.verdict && v.verdict !== 'ok');
    return `<div class="mem">
        <span class="mk ${bad?'mk-lesson':'mk-convention'}">${it.seq + 1}</span>
        <div style="min-width:0;flex:1">
          <div style="font-size:13px">${esc(it.title)}</div>
          <div class="mb"><code>${esc(it.repo)}</code>
            ${it.files.length?' · '+esc(it.files.join(', ')):' · no files named'}
            ${it.depends_on.length?' · after #'+it.depends_on.map(d=>d+1).join(', #'):''}</div>
          ${v.verdict && v.verdict!=='ok'
            ? `<div class="mb" style="color:var(--med)">reviewer says ${esc(v.verdict)}: ${esc(v.why||'')}</div>`:''}
          ${probs.map(p=>`<div class="mb" style="color:var(--med)">${esc(p.why)}${p.path?' — '+esc(p.path):''}</div>`).join('')}
        </div>
        <div class="mx"><span class="badge b-${it.status==='complete'?'high':it.status==='running'?'medium':'low'}">${esc(it.status)}</span></div>
      </div>`;
  }).join('');
  return `<div class="sec">The split — ${items.length} minimal pull request(s)</div>
          <div class="list" style="margin-bottom:14px">${rows}</div>`;
}

async function startRun(){
  const goal = $('#cgoal').value.trim(); if(!goal) return;
  const btn = $('#cgo'); btn.disabled = true; btn.textContent = 'starting…';
  try{
    const r = await send('POST','/runs',{repo:$('#crepo').value, goal,
                                         target:$('#ctarget').value.trim()||null});
    $('#cgoal').value=''; $('#ctarget').value='';
    await loadRuns(); openRun(r.id);
  }catch(e){ alert(e.message); }
  finally{ btn.disabled=false; btn.textContent='Start run'; }
}

async function loadRuns(){
  if(!$('#runlist')) coderShell();
  if(!PHASES.length){
    PHASES  = await get('/phases').catch(()=>[]);
    EPHASES = await get('/phases',{kind:'epic'}).catch(()=>[]);
  }
  const list = $('#runlist');
  try{
    const runs = await get('/runs',{limit:60});
    if(!runs.length){ list.innerHTML='<div class="empty">No runs yet.</div>'; return; }
    list.innerHTML='';
    let lastRepo = null;
    runs.forEach(r=>{
      if(r.repo !== lastRepo){                       // grouped by repo, not one flat pile
        list.appendChild(el(`<div class="phhdr" style="padding-left:13px">${esc(r.repo)}</div>`));
        lastRepo = r.repo;
      }
      const row = el(`<div class="runrow${CUR===r.id?' sel':''}" data-id="${r.id}">
          <div class="dot d-${esc(r.status)}"></div>
          <div style="min-width:0">
            <div class="rg">${esc(r.goal)}</div>
            <div class="rmeta">${esc(r.status)}${r.phase?' · '+esc(r.phase):''} · ${esc((r.created_at||'').slice(5,16).replace('T',' '))}</div>
          </div>
        </div>`);
      row.onclick = ()=>openRun(r.id);
      list.appendChild(row);
    });
  }catch(e){ list.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function openRun(id){
  if(POLL){ clearInterval(POLL); POLL=null; }
  CUR = id; SEEN = 0; EVENTS = []; FILTER = 'all';
  document.querySelectorAll('.runrow').forEach(r=>r.classList.toggle('sel', r.dataset.id===id));
  await refreshRun(true);
  POLL = setInterval(async ()=>{
    const done = await refreshRun(false);
    if(done && POLL){ clearInterval(POLL); POLL=null; loadRuns(); }
  }, 1500);
}

async function refreshRun(full){
  if(!CUR) return true;
  let run, evs;
  try{
    [run, evs] = await Promise.all([get(`/runs/${CUR}`), get(`/runs/${CUR}/events`,{after:SEEN})]);
  }catch(e){ $('#rundetail').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return true; }
  if(evs.length){ EVENTS = EVENTS.concat(evs); SEEN = evs[evs.length-1].seq; }
  if(run.kind === 'epic'){
    try{ ITEMS = (await get(`/runs/${CUR}/items`)).items; }catch(e){ ITEMS = null; }
  }else{ ITEMS = null; }
  renderRun(run);
  return !['running','queued'].includes(run.status);
}

function renderRun(run){
  const isEpic = run.kind === 'epic';
  const TABLE = isEpic ? EPHASES : PHASES;
  const done = new Set(EVENTS.map(e=>e.phase).filter(Boolean));
  const active = run.phase;
  const running = ['running','queued'].includes(run.status);
  const order = TABLE.map(p=>p.key);
  const ai = order.indexOf(active);

  const steps = TABLE.map((p,i)=>{
    let cls = 'stp';
    if(!p.implemented) cls += ' future';
    if(p.key === active && running) cls += ' on';
    else if(done.has(p.key) && (ai < 0 || i < ai || !running)) cls += ' ok';
    return `<div class="${cls}" title="${esc(p.blurb)}${p.implemented?'':' — not built yet'}">
              <i></i><span>${esc(p.title)}</span></div>`;
  }).join('');

  const last = EVENTS[EVENTS.length-1];
  // A terminal run says what it actually ended as — never a bare "finished",
  // which is what made a run that stopped at Plan look like a completed one.
  const ENDED = {complete:'complete — pull request opened',
                 incomplete:'stopped — the road runs out here',
                 blocked:'blocked — it could not continue',
                 awaiting_approval:'waiting for your decision',
                 rejected:'rejected',
                 failed:'failed'};
  const nowText = running ? (last ? last.title : 'starting…')
                          : (ENDED[run.status] || run.status);
  const pill = {running:'b-medium', queued:'b-low', complete:'b-high',
                incomplete:'b-medium', blocked:'b-medium', done:'b-high',
                awaiting_approval:'b-medium', rejected:'b-low',
                failed:'b-low'}[run.status] || 'b-low';
  const gate = run.status === 'awaiting_approval' ? `
      <div class="gate">
        <div class="gt">${isEpic
          ? 'No code has been written yet. Approving the split runs each piece as its own change — and every one of them still stops for your review before its PR is opened.'
          : 'Nothing has been pushed. Approving opens a pull request against <code>dev</code>, ready for review.'}</div>
        <div class="row" style="margin:11px 0 0">
          <button class="go" id="okbtn">${isEpic?'Approve the split':'Approve &amp; open PR'}</button>
          <button class="go" id="nobtn"
                  style="background:#33383f;color:var(--ink2)">Reject</button>
        </div>
      </div>` : '';
  const prlink = run.pr_url ? `
      <div class="blocker" style="border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.08)">
        <div class="bt" style="color:var(--hi)">Pull request opened</div>
        <div class="ba"><a href="${esc(run.pr_url)}" target="_blank" rel="noopener">${esc(run.pr_url)} ↗</a></div>
      </div>` : '';
  const blocker = (!running && (run.stopped_reason || run.error)) ? `
      <div class="blocker">
        <div class="bt">${esc(run.stopped_reason || run.error)}</div>
        ${run.next_action?`<div class="ba"><b>Next:</b> ${esc(run.next_action)}</div>`:''}
      </div>` : '';

  const counts = {finding:0, warn:0, error:0};
  EVENTS.forEach(e=>{ if(e.level==='warn') counts.warn++; else if(e.level==='error') counts.error++;
                      else if(['finding','impact'].includes(e.kind)) counts.finding++; });

  $('#rundetail').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:6px">
        <h3 style="margin:0;flex:1;font-size:15px">${esc(run.goal)}</h3>
        <span class="badge ${pill}">${esc(run.status)}</span>
      </div>
      <div class="rmeta" style="margin-bottom:14px">
        ${esc(run.repo)}${run.target?' · target '+esc(run.target):''}
        · model ${esc(run.model || 'none')} · ${esc((run.created_at||'').replace('T',' ').replace('+00:00',''))}
      </div>
      <div class="stepper">${steps}</div>
      ${prlink}${gate}${blocker}
      <div class="now">
        <div class="dot d-${esc(run.status)}" style="margin:0"></div>
        <div><b>${esc(nowText)}</b></div>
        <div style="margin-left:auto;display:flex;gap:6px">
          ${counts.finding?`<span class="badge b-low">${counts.finding} findings</span>`:''}
          ${counts.warn?`<span class="badge b-medium">${counts.warn} warnings</span>`:''}
          ${counts.error?`<span class="badge b-low" style="color:#f85149">${counts.error} errors</span>`:''}
        </div>
      </div>
      ${isEpic ? itemsPanel(ITEMS) : ''}
      <div class="chips">
        ${[['all','Everything'],['finding','Findings only'],['problem','Warnings & errors']]
          .map(([k,l])=>`<button class="chip${FILTER===k?' on':''}" data-f="${k}">${l}</button>`).join('')}
      </div>
      <div class="list" id="tl"></div>
    </div>`;

  $('#rundetail').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    FILTER = c.dataset.f; renderRun(run); });

  const ok = $('#okbtn'), no = $('#nobtn');
  if(ok) ok.onclick = async ()=>{
    ok.disabled = no.disabled = true; ok.textContent = 'opening…';
    try{ await send('POST',`/runs/${run.id}/approve`); openRun(run.id); }
    catch(e){ alert(e.message); ok.disabled = no.disabled = false;
              ok.textContent = 'Approve & open PR'; }
  };
  if(no) no.onclick = async ()=>{
    const note = prompt('Why are you rejecting it? (optional)') ?? null;
    ok.disabled = no.disabled = true;
    try{ await send('POST',`/runs/${run.id}/reject`,{note}); openRun(run.id); }
    catch(e){ alert(e.message); ok.disabled = no.disabled = false; }
  };

  const tl = $('#tl');
  const shown = EVENTS.filter(e =>
    FILTER==='all' ? true :
    FILTER==='finding' ? ['finding','impact','plan','metric'].includes(e.kind) :
    ['warn','error'].includes(e.level));
  if(!shown.length){ tl.innerHTML = '<div class="empty">nothing here yet</div>'; return; }

  let lastPhase = '\0';
  shown.forEach(e=>{
    if(e.phase !== lastPhase){
      const p = TABLE.find(x=>x.key===e.phase);
      tl.appendChild(el(`<div class="phhdr">${esc(p?p.title:(e.phase||'run'))}</div>`));
      lastPhase = e.phase;
    }
    const [g,col] = GLYPH[e.kind] || GLYPH.info;
    const pv = preview(e.detail);
    const row = el(`<div class="ev2 lv-${esc(e.level||'info')}">
        <div class="gl" style="color:${col}">${g}</div>
        <div style="min-width:0;flex:1">
          <div class="tt">${esc(e.title)}</div>
          ${pv?`<div class="pv">${esc(pv)}</div>`:''}
        </div>
        <div class="tm">${esc((e.ts||'').slice(11,19))}</div>
      </div>`);
    tl.appendChild(row);
    if(e.detail != null){
      const b = el(`<div class="body" hidden>${body(e.detail)}</div>`);
      tl.appendChild(b);
      row.onclick = ()=>{ b.hidden = !b.hidden; };
    }
  });
}

/* ── repo memory ──────────────────────────────────────────────────── */
async function loadMemory(){
  const box = $('#memory');
  box.innerHTML = '<div class="spin">…</div>';
  let d;
  try{ d = await get('/memory'); }
  catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  box.innerHTML = `<div class="hint">What the coder already knows about each repo.
    Conventions are read from the repo's own AGENTS.md / CLAUDE.md, lessons are captured
    when you reject a change, gotchas when a build trips over something. All of it is
    injected into the next run's planning and building prompts.</div>`;

  box.appendChild(el(`<div class="card" style="margin-bottom:16px">
      <div class="row" style="margin:0">
        <select id="mrepo">${REPOS.map(r=>`<option>${esc(r.name)}</option>`).join('')}</select>
        <select id="mkind">${d.kinds.map(k=>`<option>${esc(k)}</option>`).join('')}</select>
        <input id="mtitle" placeholder="short title — what it is">
        <input id="mbody" placeholder="the rule, in one or two sentences" style="flex:2">
        <button class="go" id="msave2">Remember</button>
        <button class="go" id="mprev" style="background:#33383f;color:var(--ink2)">Preview prompt</button>
      </div>
      <div id="mpv" class="hint" style="margin:11px 0 0"></div>
    </div>`));
  $('#msave2').onclick = async ()=>{
    const b = {repo:$('#mrepo').value, kind:$('#mkind').value,
               title:$('#mtitle').value.trim(), body:$('#mbody').value.trim()};
    if(!b.title||!b.body){ alert('title and body are required'); return; }
    try{ await send('POST','/memory',b); loadMemory(); }catch(e){ alert(e.message); }
  };
  $('#mprev').onclick = async ()=>{
    const p = $('#mpv'); p.textContent = 'loading…';
    try{
      const r = await get('/memory/preview',{repo:$('#mrepo').value});
      p.innerHTML = r.text
        ? `<pre style="white-space:pre-wrap;font-size:11.5px;color:var(--ink2);margin:0">${esc(r.text)}</pre>`
        : 'Nothing is remembered for this repo yet, so nothing would be injected.';
    }catch(e){ p.textContent = e.message; }
  };

  const byRepo = {};
  d.memories.forEach(m=>(byRepo[m.repo] ||= []).push(m));
  if(!d.memories.length){
    box.appendChild(el('<div class="list"><div class="empty">Nothing remembered yet. Run the coder once — it reads the repo\'s own conventions on the way through.</div></div>'));
    return;
  }
  Object.entries(byRepo).forEach(([repo, items])=>{
    box.appendChild(el(`<div class="sec">${esc(repo)} <span class="muted">· ${items.length}</span></div>`));
    const list = el('<div class="list"></div>');
    items.forEach(m=>{
      const row = el(`<div class="mem">
          <span class="mk mk-${esc(m.kind)}">${esc(m.kind)}</span>
          <div style="min-width:0;flex:1">
            <div style="font-size:13px">${esc(m.title)}</div>
            <div class="mb">${esc(m.body)}</div>
          </div>
          <div class="mx">
            <span class="srcpill">${esc(m.source||'')}${m.hits?` · used ${m.hits}×`:''}</span>
            <button class="xbtn" title="forget">×</button>
          </div>
        </div>`);
      row.querySelector('.xbtn').onclick = async ()=>{
        if(!confirm(`Forget "${m.title}"?`)) return;
        await send('DELETE',`/memory/${m.id}`); loadMemory();
      };
      list.appendChild(row);
    });
    box.appendChild(list);
  });
}

function ago(iso){
  if(!iso) return '';
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(s < 3600) return Math.round(s/60)+'m';
  if(s < 86400) return Math.round(s/3600)+'h';
  return Math.round(s/86400)+'d';
}

async function loadPRs(){
  const box = $('#prs');
  box.innerHTML = '<div class="spin">asking GitHub…</div>';
  let d;
  try{ d = await get('/prs'); }
  catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  box.innerHTML = '';
  if(d.why){
    box.appendChild(el(`<div class="blocker"><div class="bt">${esc(d.why)}</div>
      <div class="ba"><b>Note:</b> forge only ever uses the READ token here — listing
      and reading pull requests cannot approve, merge, comment or push.</div></div>`));
  }
  if(d.repos?.length){
    box.appendChild(el(`<div class="hint">watching ${d.repos.length} repo(s):
      <code>${esc(d.repos.join(', '))}</code></div>`));
  }
  (d.errors||[]).forEach(e=>box.appendChild(
    el(`<div class="note">${esc(e.repo)}: ${esc(e.error)}</div>`)));

  if(!d.prs?.length){
    box.appendChild(el('<div class="list"><div class="empty">No open pull requests.</div></div>'));
    return;
  }
  box.appendChild(el('<div class="sec">Open pull requests</div>'));
  const list = el('<div class="list"></div>');
  d.prs.forEach(p=>{
    const row = el(`<div class="item">
        <span class="kind">#${p.number}</span>
        <div style="min-width:0;flex:1">
          <div class="qn">${esc(p.title)}</div>
          <div class="sig">${esc(p.repo)} · ${esc(p.author||'?')} ·
            <code>${esc(p.head||'')}</code> → <code>${esc(p.base||'')}</code>
            ${p.draft?' · draft':''}${p.indexed_as?'':' · not indexed locally'}</div>
        </div>
        <div class="loc">${esc(ago(p.updated_at))} ago</div>
      </div>`);
    const det = el('<div class="body" hidden><div class="spin">loading…</div></div>');
    let loaded = false;
    row.onclick = async ()=>{
      det.hidden = !det.hidden;
      if(loaded || det.hidden) return;
      loaded = true;
      try{
        const [owner, name] = p.repo.split('/');
        det.innerHTML = prBody(await get(`/prs/${owner}/${name}/${p.number}`));
      }catch(e){ det.innerHTML = `<span class="badge b-low">failed</span> ${esc(e.message)}`; loaded=false; }
    };
    list.appendChild(row); list.appendChild(det);
  });
  box.appendChild(list);
}

function prBody(d){
  const imp = d.impact || {};
  let impHtml;
  if(!imp.available){
    impHtml = `<div class="muted">${esc(imp.why||'impact unavailable')}</div>`;
  }else if(!imp.reaches?.length){
    impHtml = `<div class="muted">No cross-repo impact found across
      ${imp.checked} checked file(s).</div>`;
  }else{
    impHtml = imp.reaches.map(r=>`
      <div style="margin-bottom:9px">
        <span class="badge b-${esc(r.confidence)}">${esc(r.confidence)}</span>
        <b style="font-family:var(--mono)">${esc(r.repo)}</b>
        <span class="muted">via ${esc(r.files.join(', '))}</span>
        ${r.evidence.map(e=>`<div class="muted" style="font-family:var(--mono);font-size:11px;margin-left:4px">
            ${esc(e.signal)}: ${esc(e.their_path||e.name||'')} — ${esc(e.file||'')}:${esc(e.line||'')}
          </div>`).join('')}
      </div>`).join('');
  }
  const files = (d.files||[]).slice(0,60).map(f=>
    `<tr><td>${esc(f.status)}</td><td>${esc(f.path)}</td>
      <td style="color:var(--hi)">+${f.additions}</td>
      <td style="color:#f85149">−${f.deletions}</td></tr>`).join('');
  return `
    <div style="margin-bottom:12px">
      <div class="sec" style="margin-top:0">Reaches other repos</div>
      ${impHtml}
    </div>
    <div class="sec">Changed files (${d.changed_files ?? (d.files||[]).length}) ·
      <span style="color:var(--hi)">+${d.additions??'?'}</span>
      <span style="color:#f85149">−${d.deletions??'?'}</span></div>
    <table>${files}</table>
    ${d.body?`<div class="sec">Description</div><div class="prose">${esc(d.body.slice(0,3000))}</div>`:''}
    <div style="margin-top:12px"><a href="${esc(d.url)}" target="_blank" rel="noopener">open on GitHub ↗</a></div>`;
}

/* ── settings: credentials + models ───────────────────────────────── */
const PROVIDERS = ['github','anthropic','openai','openai-compatible','ollama','claude-cli'];
const ROLES = ['engineer','council','judge','fast'];

async function send(method, path, body){
  const r = await fetch(new URL(API+path, location.href), {
    method, headers:{'Content-Type':'application/json'},
    body: body?JSON.stringify(body):undefined });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

function verdict(res){
  const bits = [];
  if(res.ok) bits.push(`<span class="badge b-high">ok</span> ${esc(res.detail||'')}`);
  else bits.push(`<span class="badge b-low">failed</span> ${esc(res.detail||'')}`);
  if(res.scopes?.length) bits.push(`<div class="muted" style="margin-top:5px">scopes: <code>${esc(res.scopes.join(', '))}</code></div>`);
  (res.warnings||[]).forEach(w=>bits.push(`<div class="note">${esc(w)}</div>`));
  return bits.join('');
}

async function loadSettings(){
  const box = $('#settings');
  box.innerHTML = '<div class="spin">loading…</div>';
  try{
    const [secrets, models] = await Promise.all([get('/settings'), get('/models')]);
    box.innerHTML = '<div class="sec">Credentials</div>';
    box.appendChild(el(`<div class="hint" style="margin-bottom:12px">
      Stored encrypted (AES-GCM) in forge's own config database, never in the code index.
      Values are write-only — once saved, only the last four characters are ever shown again.</div>`));

    const grid = el('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))"></div>');
    secrets.forEach(s=>grid.appendChild(secretCard(s)));
    box.appendChild(grid);

    box.appendChild(el('<div class="sec">Add another key</div>'));
    box.appendChild(el(`<div class="card">
        <div class="row" style="margin:0">
          <input id="nk" placeholder="key name, e.g. anthropic_api_key" style="min-width:200px">
          <select id="np">${PROVIDERS.map(p=>`<option>${p}</option>`).join('')}</select>
          <input id="nv" type="password" placeholder="value" style="min-width:200px">
          <button class="go" id="nsave">Save</button>
        </div></div>`));
    $('#nsave').onclick = async ()=>{
      const key=$('#nk').value.trim(), value=$('#nv').value;
      if(!key||!value) return;
      try{ await send('PUT','/settings',{key,value,provider:$('#np').value}); loadSettings(); }
      catch(e){ alert(e.message); }
    };

    /* models */
    box.appendChild(el('<div class="sec">Models</div>'));
    box.appendChild(el(`<div class="hint" style="margin-bottom:12px">
      Registered models the engineer loop can be pointed at. A role lets a run pick
      by purpose rather than by name.</div>`));
    const ml = el('<div class="list"></div>');
    if(!models.length) ml.appendChild(el('<div class="empty">No models registered yet.</div>'));
    models.forEach(m=>{
      const row = el(`<div class="item" style="cursor:default">
          <span class="kind">${esc(m.role||'—')}</span>
          <div style="min-width:0;flex:1">
            <div class="qn">${esc(m.name)}</div>
            <div class="sig">${esc(m.provider)} · ${esc(m.model_id)}${m.base_url?' · '+esc(m.base_url):''}</div>
            <div class="mres muted" style="font-size:12px"></div>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            ${m.credential_present?'':'<span class="badge b-medium">no key</span>'}
            <button class="go tst" style="padding:5px 11px">Test</button>
            <button class="go del" style="padding:5px 11px;background:#33383f;color:var(--ink2)">Remove</button>
          </div>
        </div>`);
      row.querySelector('.tst').onclick = async ()=>{
        const out = row.querySelector('.mres'); out.innerHTML='testing…';
        try{ out.innerHTML = verdict(await send('POST',`/models/${encodeURIComponent(m.name)}/test`)); }
        catch(e){ out.innerHTML = `<span class="badge b-low">failed</span> ${esc(e.message)}`; }
      };
      row.querySelector('.del').onclick = async ()=>{
        if(!confirm(`Remove model ${m.name}?`)) return;
        await send('DELETE',`/models/${encodeURIComponent(m.name)}`); loadSettings();
      };
      if(m.meta) row.querySelector('.mres').innerHTML = verdict(m.meta);
      ml.appendChild(row);
    });
    box.appendChild(ml);

    const keyOpts = secrets.filter(s=>s.set).map(s=>`<option>${esc(s.key)}</option>`).join('');
    box.appendChild(el('<div class="sec">Register a model</div>'));
    box.appendChild(el(`<div class="card">
        <div class="row" style="margin:0">
          <input id="mn" placeholder="name, e.g. opus-engineer" style="min-width:170px">
          <select id="mp">${PROVIDERS.filter(p=>p!=='github').map(p=>`<option>${p}</option>`).join('')}</select>
          <input id="mi" placeholder="model id" style="min-width:170px">
          <select id="mk"><option value="">— credential —</option>${keyOpts}</select>
          <select id="mr"><option value="">— role —</option>${ROLES.map(r=>`<option>${r}</option>`).join('')}</select>
          <input id="mb" placeholder="base url (optional)" style="min-width:150px">
          <button class="go" id="mfetch" style="background:#33383f;color:var(--ink2)">List models</button>
          <button class="go" id="msave">Add</button>
        </div>
        <div id="mhint" class="hint" style="margin:10px 0 0"></div>
      </div>`));
    $('#mfetch').onclick = async ()=>{
      const h=$('#mhint'); h.textContent='asking the provider…';
      try{
        const r = await get(`/providers/${$('#mp').value}/models`,
                            {secret_key:$('#mk').value, base_url:$('#mb').value});
        h.innerHTML = r.models.length
          ? `${r.models.length} available — click one to fill: ` + r.models.slice(0,40)
              .map(m=>`<a href="#" data-m="${esc(m)}"><code>${esc(m)}</code></a>`).join(' · ')
          : 'provider returned no models';
        h.querySelectorAll('a').forEach(a=>a.onclick=e=>{
          e.preventDefault(); $('#mi').value = a.dataset.m; });
      }catch(e){ h.textContent = e.message; }
    };
    $('#msave').onclick = async ()=>{
      const b = {name:$('#mn').value.trim(), provider:$('#mp').value,
                 model_id:$('#mi').value.trim(), base_url:$('#mb').value.trim()||null,
                 secret_key:$('#mk').value||null, role:$('#mr').value||null};
      if(!b.name||!b.model_id){ alert('name and model id are required'); return; }
      try{ await send('POST','/models',b); loadSettings(); }catch(e){ alert(e.message); }
    };
  }catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function secretCard(s){
  const c = el(`<div class="card">
      <h3>${esc(s.key)} ${s.set?'<span class="badge b-high">set</span>':'<span class="badge b-low">not set</span>'}</h3>
      <div class="muted" style="font-size:12.5px;margin-bottom:11px">${esc(s.label||'')}</div>
      ${s.set?`<div class="kv"><span>value</span><span>${esc(s.hint||'')}</span></div>
               <div class="kv"><span>updated</span><span>${esc((s.updated_at||'').replace('T',' ').replace('+00:00',''))}</span></div>`:''}
      <div class="row" style="margin:11px 0 0">
        <input class="val" type="password" placeholder="${s.set?'replace value…':'paste value…'}">
        <button class="go save" style="padding:7px 13px">Save</button>
        ${s.set?'<button class="go ver" style="padding:7px 13px;background:#33383f;color:var(--ink2)">Verify</button>':''}
        ${s.set&&!s.wellknown?'<button class="go rm" style="padding:7px 13px;background:#33383f;color:var(--ink2)">Delete</button>':''}
      </div>
      <div class="res" style="margin-top:10px;font-size:12.5px"></div>
    </div>`);
  const res = c.querySelector('.res');
  c.querySelector('.save').onclick = async ()=>{
    const v = c.querySelector('.val').value;
    if(!v) return;
    try{ await send('PUT','/settings',{key:s.key, value:v, provider:s.provider}); loadSettings(); }
    catch(e){ res.innerHTML = `<span class="badge b-low">failed</span> ${esc(e.message)}`; }
  };
  c.querySelector('.ver')?.addEventListener('click', async ()=>{
    res.innerHTML = 'checking…';
    try{ res.innerHTML = verdict(await send('POST',`/settings/${encodeURIComponent(s.key)}/verify`)); }
    catch(e){ res.innerHTML = `<span class="badge b-low">failed</span> ${esc(e.message)}`; }
  });
  c.querySelector('.rm')?.addEventListener('click', async ()=>{
    if(!confirm(`Delete ${s.key}?`)) return;
    await send('DELETE',`/settings/${encodeURIComponent(s.key)}`); loadSettings();
  });
  if(s.meta) res.innerHTML = verdict(s.meta);
  return c;
}
