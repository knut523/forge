<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forge — code index</title>
<style>
  :root{
    /* Light theme. Same variable names as the old dark palette, so every rule below is untouched;
       only these values flip. Ink is dark-on-light and the accent is deepened a touch so it holds
       contrast on white. */
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f6; --line:#e3e8ef;
    --ink:#1b2530; --ink2:#586675; --ink3:#8a95a4;
    --accent:#e8720a;
    --hi:#1a9e4b; --med:#b07817; --lo:#7a8696;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  /* Grid and flex children default to min-width:auto, so one long file path or
     wide table stretches its whole column and the page scrolls sideways.
     Everything that lays out children opts them back out of that. */
  .split>*,.grid>*,.item>*,.row>*,.ev2>*,.link>*,.runrow>*{min-width:0}
  a{color:var(--accent);text-decoration:none}
  .app{display:flex;min-height:100vh;align-items:stretch}
  .side{width:214px;flex:none;background:var(--panel);border-right:1px solid var(--line);
        padding:16px 12px;display:flex;flex-direction:column;gap:12px;
        position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 2px}
  .side #orgsel{width:100%;flex:none}
  .main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{padding:11px 24px;border-bottom:1px solid var(--line);background:var(--panel);
          position:sticky;top:0;z-index:10;color:var(--ink3);font-size:12.5px}
  .navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);
            padding:12px 10px 3px;font-weight:600}
  .logo{width:26px;height:26px;border-radius:7px;flex:none;
        background:linear-gradient(135deg,var(--accent),#b85c1d);
        display:grid;place-items:center;font-weight:700;color:#1a1005;font-size:15px}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .sub{color:var(--ink3);font-size:12px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;
    color:var(--ink2);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-family:inherit}
  .side nav button:hover{color:var(--ink);background:var(--panel2)}
  .side nav button.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
  main{padding:22px 24px;max-width:1120px;margin:0;width:100%}
  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
    .side #orgsel{width:auto}
    .side nav{flex-direction:row;flex-wrap:wrap}
    .navgroup{display:none}
  }
  .grid{display:grid;gap:14px;
        grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:600}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}
  .kv span:first-child{color:var(--ink3)}
  .kv span:last-child{font-family:var(--mono);font-size:12px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:9px 12px;border-radius:8px;font:inherit;font-size:13px;max-width:100%}
  input{flex:1 1 180px;min-width:0}
  select{flex:0 1 auto;min-width:0}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  button.go{background:var(--accent);color:#1a1005;border:none;padding:9px 17px;
    border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}
  button.go:hover{filter:brightness(1.1)}
  .list{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
  .item{padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer;
        display:flex;gap:11px;align-items:baseline}
  .item:last-child{border-bottom:none}
  .item:hover{background:var(--panel2)}
  .kind{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);
        border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex:none}
  .qn{font-family:var(--mono);font-size:13px;color:var(--ink)}
  .loc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);
       text-align:right;flex:0 1 auto;max-width:38%;overflow-wrap:anywhere}
  .sig{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;
         border-radius:20px;text-transform:uppercase}
  .b-high{background:rgba(63,185,80,.15);color:var(--hi);border:1px solid rgba(63,185,80,.3)}
  .b-medium{background:rgba(210,153,34,.15);color:var(--med);border:1px solid rgba(210,153,34,.3)}
  .b-low{background:rgba(139,148,158,.13);color:var(--lo);border:1px solid rgba(139,148,158,.28)}
  .ev{font-family:var(--mono);font-size:12px;padding:8px 14px;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:none}
  .ev .p{color:var(--ink2)}
  .ev .arrow{color:var(--accent)}
  .muted{color:var(--ink3)}
  .note{background:rgba(232,114,10,.08);border:1px solid rgba(232,114,10,.25);
        color:#9a5310;padding:10px 13px;border-radius:9px;font-size:13px;margin-top:12px}
  .sec{margin:22px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;
       color:var(--ink3);font-weight:600}
  .link{display:flex;align-items:center;gap:10px;padding:10px 15px;
        border-bottom:1px solid var(--line);font-size:13px}
  .link:last-child{border-bottom:none}
  .link code{font-family:var(--mono);color:var(--ink)}
  .bar{height:5px;border-radius:3px;background:var(--accent);flex:none}
  .empty{padding:30px;text-align:center;color:var(--ink3)}
  .spin{padding:22px;text-align:center;color:var(--ink3);font-size:13px}
  .hint{font-size:12px;color:var(--ink3);margin-top:-6px;margin-bottom:12px}

  /* ── coder view ───────────────────────────────────────────── */
  .split{display:grid;gap:16px;grid-template-columns:270px 1fr;align-items:start}
  @media(max-width:860px){.split{grid-template-columns:1fr}}
  .runrow{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:9px}
  .runrow:last-child{border-bottom:none}
  .runrow:hover{background:var(--panel2)}
  .runrow.sel{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
  .d-running{background:var(--accent);animation:pulse 1.4s infinite}
  .d-complete{background:var(--hi)} .d-done{background:var(--hi)}
  .d-incomplete{background:var(--med)} .d-blocked{background:var(--accent)}
  .d-failed{background:#f85149} .d-queued{background:var(--ink3)}
  .blocker{border:1px solid rgba(240,136,62,.35);background:rgba(240,136,62,.08);
           border-radius:10px;padding:13px 15px;margin-bottom:14px}
  .blocker .bt{font-size:13px;color:#e8b48a;line-height:1.5}
  .blocker .ba{font-size:12.5px;color:var(--ink2);margin-top:7px;
               padding-top:7px;border-top:1px solid rgba(240,136,62,.22)}
  .blocker .ba b{color:var(--accent)}
  .d-awaiting_approval{background:var(--accent)} .d-rejected{background:var(--ink3)}
  .d-review{background:var(--accent)} .d-pending{background:var(--ink3)}
  .viewbar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
  .viewbar .vbspacer{flex:1}
  .viewbar button{font-size:12px;padding:4px 13px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel);color:var(--ink2);cursor:pointer}
  .viewbar button.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
  .ecar{display:inline-block;width:15px;color:var(--ink3);cursor:pointer;user-select:none}
  .ecar:hover{color:var(--accent)}
  .split.board-mode{grid-template-columns:1fr}
  .kanban{display:flex;gap:11px;padding:11px;align-items:flex-start}
  .kcol{flex:1;min-width:0;background:var(--panel2);border-radius:10px;padding:8px 8px 4px}
  .khead{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink3);padding:3px 6px 9px}
  .kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 9px;
    margin-bottom:7px;cursor:pointer;display:flex;gap:8px}
  .kcard:hover{border-color:var(--accent)}
  .kcard.sel{box-shadow:inset 2px 0 0 var(--accent)}
  .gate{border:1px solid rgba(63,185,80,.32);background:rgba(63,185,80,.07);
        border-radius:10px;padding:13px 15px;margin-bottom:14px}
  .gate .gt{font-size:13px;color:var(--ink);line-height:1.5}
  .gate code{font-family:var(--mono);color:var(--hi)}
  .subnav{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);
          border-radius:9px;margin-bottom:16px;width:fit-content;max-width:100%;flex-wrap:wrap}
  .subnav button{background:transparent;border:none;color:var(--ink3);padding:6px 15px;
                 border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
  .subnav button:hover{color:var(--ink)}
  .subnav button.on{background:var(--panel2);color:var(--ink)}
  .mem{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
  .mem:last-child{border-bottom:none}
  .mem .mk{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;padding:3px 7px;
           border-radius:5px;flex:none;margin-top:1px}
  .mk-gotcha{background:rgba(248,81,73,.14);color:#f85149}
  .mk-lesson{background:rgba(240,136,62,.14);color:var(--accent)}
  .mk-convention{background:rgba(63,185,80,.13);color:var(--hi)}
  .mk-decision{background:rgba(139,148,158,.14);color:var(--lo)}
  .mem .mb{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.5}
  .mem .mx{margin-left:auto;flex:none;display:flex;gap:8px;align-items:center}
  .srcpill{font-size:10px;color:var(--ink3);font-family:var(--mono)}
  .xbtn{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 4px}
  .xbtn:hover{color:#f85149}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .rg{font-size:12.5px;line-height:1.35;overflow:hidden;display:-webkit-box;
      -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .rmeta{font-size:10.5px;color:var(--ink3);font-family:var(--mono);margin-top:3px}

  .stepper{display:flex;gap:0;overflow-x:auto;padding:2px 0 10px}
  .stp{flex:1;min-width:84px;text-align:center;position:relative;padding-top:20px}
  .stp:before{content:'';position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
  .stp:first-child:before{left:50%} .stp:last-child:before{right:50%}
  .stp i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:12px;height:12px;
         border-radius:50%;background:var(--panel);border:2px solid var(--line)}
  .stp.on i{border-color:var(--accent);background:var(--accent);animation:pulse 1.4s infinite}
  .stp.ok i{border-color:var(--hi);background:var(--hi)}
  .stp span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
  .stp.on span{color:var(--accent);font-weight:700}
  .stp.ok span{color:var(--ink2)}
  .stp.future{opacity:.42}
  .stp.future span:after{content:' ·';}

  .now{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--panel2);
       border:1px solid var(--line);border-radius:10px;margin-bottom:14px;font-size:14px}
  .now b{font-weight:600}
  .phgroup{margin-bottom:6px}
  .phhdr{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink3);
         padding:11px 4px 6px;font-weight:700}
  .ev2{display:flex;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);
       align-items:flex-start;cursor:pointer}
  .ev2:last-child{border-bottom:none}
  .ev2:hover{background:var(--panel2)}
  .ev2 .gl{width:16px;text-align:center;flex:none;font-size:13px;line-height:1.5}
  .ev2 .tt{font-size:13px;line-height:1.45}
  .ev2 .pv{font-size:11.5px;color:var(--ink3);font-family:var(--mono);margin-top:2px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .ev2 .tm{margin-left:auto;font-size:10.5px;color:var(--ink3);font-family:var(--mono);flex:none}
  .ev2.lv-warn{background:rgba(210,153,34,.06)}
  .ev2.lv-error{background:rgba(248,81,73,.07)}
  .body{padding:2px 13px 14px 39px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .body pre{margin:0;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;
            word-break:break-word;color:var(--ink2);max-height:420px;overflow:auto}
  .body table{border-collapse:collapse;font-size:11.5px;font-family:var(--mono);
              width:100%;table-layout:fixed}
  .body td{padding:3px 10px 3px 0;vertical-align:top;color:var(--ink2);
           border-bottom:1px solid var(--line);overflow-wrap:anywhere}
  .body td:first-child{color:var(--ink3);width:30%}
  .body pre{max-width:100%}
  .prose{font-family:ui-sans-serif,system-ui;font-size:13px;line-height:1.6;color:var(--ink);
         white-space:pre-wrap}
  .chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .chip{font-size:11.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
        color:var(--ink2);cursor:pointer;background:transparent;font-family:inherit}
  .chip.on{background:var(--panel2);color:var(--ink);border-color:var(--accent)}

  /* Long identifiers, paths and URLs break rather than widen their container. */
  .qn,.tt,.rg,.prose,.bt,.sec,.kv span:last-child,.link code,h1,h3{overflow-wrap:anywhere}
  .stepper{max-width:100%}
  pre,code{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">f</div><h1>forge</h1></div>
    <select id="orgsel" title="Active organization (GitHub owner)">
      <option value="">All orgs</option>
    </select>
    <nav>
      <div class="navgroup">Work</div>
      <button data-tab="coder" class="on">Build</button>
      <button data-tab="activity">Activity</button>
      <button data-tab="chat">Chat</button>
      <div class="navgroup">Explore</div>
      <button data-tab="code">Code</button>
      <button data-tab="prs">PRs</button>
      <button data-tab="memory">Memory</button>
      <div class="navgroup">System</div>
      <button data-tab="settings">Settings</button>
    </nav>
  </aside>
  <div class="main-wrap">
    <div class="topbar"><span id="hdr">code index &amp; cross-repo wayfinder</span></div>
    <main>
      <div id="coder"></div>
      <div id="activity" hidden></div>
      <div id="chat" hidden></div>
      <div id="code" hidden>
        <div class="subnav">
          <button data-sub="repos" class="on">Overview</button>
          <button data-sub="explore">Search</button>
          <button data-sub="wayfinder">Impact</button>
        </div>
        <div id="repos"></div>
        <div id="explore" hidden></div>
        <div id="wayfinder" hidden></div>
      </div>
      <div id="prs" hidden></div>
      <div id="memory" hidden></div>
      <div id="settings" hidden></div>
    </main>
  </div>
</div>

<script>
const API = new URL('api/', document.baseURI).href.replace(/\/+$/, '');
const $  = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc= (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num= (n)=>Number(n??0).toLocaleString();

async function get(p, q={}){
  const u = new URL(API+p, location.href);
  Object.entries(q).forEach(([k,v])=>{ if(v!=null && v!=='') u.searchParams.set(k,v); });
  const r = await fetch(u);
  if(!r.ok){ throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail); }
  return r.json();
}

let ALL_REPOS = [], REPOS = [];
let ACTIVE_ORG = localStorage.getItem('forge_org') || null;
let PR_SORT = localStorage.getItem('forge_prsort') || 'app';   // app | number | recent
let ACT_POLL = null, ACT_OPEN = null, ACT_SEEN = 0;            // Activity view state

/* The active org (a GitHub owner) is the axis that keeps prometheus work and
   olaf work apart: it scopes the repo pickers everywhere and the PRs view. */
function applyOrg(){
  REPOS = ACTIVE_ORG
    ? ALL_REPOS.filter(r => (r.origin || '').split('/')[0] === ACTIVE_ORG)
    : ALL_REPOS;
}

async function loadOrgSwitcher(){
  let orgs = [];
  try{ orgs = (await get('/orgs')).orgs || []; }catch(e){}
  const sel = $('#orgsel');
  sel.innerHTML = '<option value="">All orgs</option>' + orgs.map(o=>
    `<option value="${esc(o.org)}"${o.org===ACTIVE_ORG?' selected':''}>${esc(o.org)}`
    + ` · ${o.repo_count}${o.token==='none'?' · no token':''}</option>`).join('');
  if(ACTIVE_ORG && !orgs.some(o=>o.org===ACTIVE_ORG)){ ACTIVE_ORG=null; localStorage.removeItem('forge_org'); }
  sel.value = ACTIVE_ORG || '';
  sel.onchange = ()=>switchOrg(sel.value || null);
}

function switchOrg(org){
  ACTIVE_ORG = org || null;
  if(ACTIVE_ORG) localStorage.setItem('forge_org', ACTIVE_ORG);
  else localStorage.removeItem('forge_org');
  applyOrg();
  coderShell(); exploreShell(); wayShell();       // rebuild pickers with the filter
  const active = document.querySelector('nav button.on')?.dataset.tab;
  ({coder:loadRuns, activity:loadActivity, prs:loadPRs, memory:loadMemory,
    code:loadRepos, settings:loadSettings}[active] || (()=>{}))();
}

/* ── tabs ─────────────────────────────────────────────────────────── */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['coder','activity','chat','code','prs','memory','settings'].forEach(t=>$('#'+t).hidden = (t!==b.dataset.tab));
  if(b.dataset.tab!=='activity' && ACT_POLL){ clearInterval(ACT_POLL); ACT_POLL=null; }
  if(b.dataset.tab==='settings') loadSettings();
  if(b.dataset.tab==='coder') loadRuns();
  if(b.dataset.tab==='activity') loadActivity();
  if(b.dataset.tab==='chat') loadChat();
  if(b.dataset.tab==='prs') loadPRs();
  if(b.dataset.tab==='memory') loadMemory();
});
document.querySelectorAll('.subnav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.subnav button').forEach(x=>x.classList.toggle('on',x===b));
  ['repos','explore','wayfinder'].forEach(t=>$('#'+t).hidden = (t!==b.dataset.sub));
  if(b.dataset.sub==='explore') $('#q')?.focus();
});

/* ── chat (multi-conversation) ────────────────────────────────────── */
let CHATS = JSON.parse(localStorage.getItem('forge_chats') || 'null') || {};   // id -> {id,title,model,messages}
let CHATID = localStorage.getItem('forge_chatid') || null;
let CHATMODELS = [];
function saveChats(){ localStorage.setItem('forge_chats', JSON.stringify(CHATS)); if(CHATID) localStorage.setItem('forge_chatid', CHATID); }
function curChat(){ return CHATID ? CHATS[CHATID] : null; }
function newChat(){ const id='c'+Date.now(); CHATS[id]={id,title:'New chat',model:null,messages:[]}; CHATID=id; saveChats(); return id; }

async function loadChat(){
  if(!CHATMODELS.length){ try{ CHATMODELS=(await get('/models')).filter(m=>m.enabled).map(m=>m.name); }catch(e){} }
  if(!Object.keys(CHATS).length) newChat();
  if(!CHATID || !CHATS[CHATID]) CHATID = Object.keys(CHATS).sort().reverse()[0];
  renderChatShell();
}
function renderChatShell(){
  const box = $('#chat');
  const opts = ['<option value="">auto (best available)</option>']
    .concat(CHATMODELS.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`)).join('');
  box.innerHTML = `
    <div class="split" style="grid-template-columns:210px 1fr">
      <div class="list" style="display:flex;flex-direction:column;max-height:calc(100vh - 118px)">
        <div style="padding:9px"><button class="go" id="cnew" style="width:100%">+ New chat</button></div>
        <div id="chatlist" style="flex:1;overflow-y:auto"></div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;height:calc(100vh - 150px);padding:0;overflow:hidden">

}
function renderChatList(){
  const box = $('#chatlist'); if(!box) return; box.innerHTML='';
  Object.keys(CHATS).sort().reverse().forEach(id=>{
    const c = CHATS[id];
    const row = el(`<div class="runrow${id===CHATID?' sel':''}" style="align-items:center">

    row.onclick = ()=>{ CHATID=id; saveChats(); renderChatShell(); };
    row.querySelector('.cdel').onclick = (e)=>{ e.stopPropagation(); delete CHATS[id];

function renderChat(){
  const log = $('#chatlog'); if(!log) return; const c = curChat();
  const msgs = c ? c.messages : [];
  if(!msgs.length){ log.innerHTML = `<div class="empty">Start a conversation — runs on forge's model.</div>`; return; }
  log.innerHTML = '';
  msgs.forEach(m=>{
    const me = m.role==='user';
    log.appendChild(el(`<div style="margin:0 0 14px;display:flex;${me?'justify-content:flex-end':''}">
      <div style="max-width:78%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;font-size:13.5px;line-height:1.55;
        ${me?'background:var(--accent);color:#1a1005':'background:var(--panel2);color:var(--ink)'}">${esc(m.content)}</div></div>`));
  });
  log.scrollTop = log.scrollHeight;
}
async function sendChat(){
  const c = curChat(), inp = $('#chatin'); if(!c || !inp) return;
  const q = inp.value.trim(); if(!q) return;
  inp.value=''; inp.disabled=true;
  c.messages.push({role:'user', content:q});
  if(!c.title || c.title==='New chat') c.title = q.slice(0,42);
  c.messages.push({role:'assistant', content:'…'}); saveChats(); renderChatList(); renderChat();
  try{
    const r = await send('POST','/chat',{messages: c.messages.slice(0,-1), model: c.model||undefined});
    c.messages[c.messages.length-1].content = r.text || '(no response)';
  }catch(e){ c.messages[c.messages.length-1].content = '⚠ '+e.message; }
  saveChats(); renderChat(); inp.disabled=false; inp.focus();
}

/* ── coder: runs ──────────────────────────────────────────────────── */
const GLYPH = {step:['▸','var(--accent)'], metric:['▦','var(--ink2)'], finding:['◆','var(--accent)'],
  impact:['⚡','var(--med)'], warn:['▲','var(--med)'], error:['✕','#f85149'],
  plan:['▤','var(--accent)'], done:['✓','var(--hi)'], info:['·','var(--ink3)'],
  diff:['±','var(--accent)'], file:['▸','var(--ink2)']};
let PHASES = [], EPHASES = [], CUR = null, POLL = null, SEEN = 0, EVENTS = [],
    FILTER = 'all', ITEMS = null;
let VIEW = localStorage.getItem('forge_view') || 'tree';   // 'tree' | 'board'
let BOARD_LEVEL = localStorage.getItem('forge_board_level') || 'task';  // 'task' | 'epic' — board granularity
let EXPANDED = new Set(JSON.parse(localStorage.getItem('forge_expanded') || '[]'));  // epics shown open (default collapsed)

function flat(v){
  if(v==null) return '';
  if(typeof v === 'string') return v;
  if(typeof v !== 'object') return String(v);
  if(Array.isArray(v)) return v.map(flat).join(', ');
  return Object.entries(v).map(([k,x])=>`${k}=${flat(x)}`).join('  ');
}
function preview(d){
  if(d==null) return '';
  if(d.text) return String(d.text).split('\n').find(l=>l.trim()) || '';
  if(Array.isArray(d)) return d.length ? `${d.length} × ${flat(d[0]).slice(0,90)}` : '';
  return flat(d).slice(0,160);
}
function body(d){
  if(d==null) return '';
  if(d.text && /^(---|\+\+\+|@@|diff )/m.test(d.text)){
    const html = d.text.split('\n').map(l=>{
      const c = l.startsWith('+') && !l.startsWith('+++') ? 'var(--hi)'
              : l.startsWith('-') && !l.startsWith('---') ? '#f85149'
              : l.startsWith('@@') ? 'var(--accent)' : 'var(--ink3)';
      return `<span style="color:${c}">${esc(l)}</span>`;
    }).join('\n');
    return `<pre>${html}</pre>`;
  }
  if(d.text){
    const rest = Object.entries(d).filter(([k])=>k!=='text');
    return `<div class="prose">${esc(d.text)}</div>` +
      (rest.length?`<table style="margin-top:10px">${rest.map(([k,v])=>
        `<tr><td>${esc(k)}</td><td>${esc(flat(v))}</td></tr>`).join('')}</table>`:'');
  }
  if(Array.isArray(d)){
    if(!d.length) return '<span class="muted">empty</span>';
    if(typeof d[0] === 'object'){
      const cols = [...new Set(d.flatMap(o=>Object.keys(o||{})))];
      return `<table><tr>${cols.map(c=>`<td style="color:var(--ink3)">${esc(c)}</td>`).join('')}</tr>`
        + d.slice(0,60).map(o=>`<tr>${cols.map(c=>`<td>${esc(flat(o?.[c]))}</td>`).join('')}</tr>`).join('')
        + `</table>${d.length>60?`<div class="muted" style="margin-top:6px">…${d.length-60} more</div>`:''}`;
    }
    return `<pre>${esc(d.join('\n'))}</pre>`;
  }
  return `<table>${Object.entries(d).map(([k,v])=>
    `<tr><td>${esc(k)}</td><td>${typeof v==='object'&&v!==null
      ? `<pre>${esc(JSON.stringify(v,null,2))}</pre>` : esc(flat(v))}</td></tr>`).join('')}</table>`;
}

function coderShell(){
  const repoChecks = REPOS.map(r=>`<label style="display:inline-flex;align-items:center;gap:5px;
    margin:0 13px 7px 0;white-space:nowrap;font-size:12.5px"><input type="checkbox" class="crepo"

async function detectInto(goalSel, apply, btnSel){

  if(!goal){ $(goalSel).focus(); return; }
  const b = $(btnSel); b.disabled = true; const label = b.textContent; b.textContent = 'detecting…';
  try{
    const r = await send('POST','/detect-repos',{goal, org: ACTIVE_ORG});
    apply((r.suggested||[]).map(s=>s.repo));
  }catch(e){ alert(e.message); }
  b.disabled = false; b.textContent = label;
}

  const rows = items.map(it=>{
    const a = it.assessment || {};

    const probs = a.problems || [];
    const bad = probs.length || (v.verdict && v.verdict !== 'ok');
    return `<div class="mem">
        <span class="mk ${bad?'mk-lesson':'mk-convention'}">${it.seq + 1}</span>
        <div style="min-width:0;flex:1">

          <div class="mb"><code>${esc(it.repo)}</code>
            ${it.files.length?' · '+esc(it.files.join(', ')):' · no files named'}
            ${it.depends_on.length?' · after #'+it.depends_on.map(d=>d+1).join(', #'):''}</div>
          ${v.verdict && v.verdict!=='ok'
            ? `<div class="mb" style="color:var(--med)">reviewer says ${esc(v.verdict)}: ${esc(v.why||'')}</div>`:''}
          ${probs.map(p=>`<div class="mb" style="color:var(--med)">${esc(p.why)}${p.path?' — '+esc(p.path):''}</div>`).join('')}

async function startRun(){

async function loadRuns(){
  if(!$('#runlist')) coderShell();

  }

  const sp = $('#codersplit'); if(sp) sp.classList.toggle('board-mode', VIEW==='board');
  try{
    let runs = await get('/runs',{limit:60});
    runs = runs.filter(x=>x.kind!=='review');       // reviews have their own live view in PRs
    if(ACTIVE_ORG){ const names=new Set(REPOS.map(r=>r.name)); runs = runs.filter(x=>names.has(x.repo)); }
    list.innerHTML=''; const attn = $('#needsattn'); if(attn) attn.innerHTML='';
    const bar = el(`<div class="viewbar">
        <button data-v="tree" class="${VIEW==='tree'?'on':''}">Tree</button>
        <button data-v="board" class="${VIEW==='board'?'on':''}">Board</button>
        ${VIEW==='board'?`<span class="vbspacer"></span>
        <button data-lvl="task" class="${BOARD_LEVEL==='task'?'on':''}" title="A card per subtask">Subtasks</button>
        <button data-lvl="epic" class="${BOARD_LEVEL==='epic'?'on':''}" title="A card per feature (epic)">Epics</button>`:''}</div>`);
    bar.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{ VIEW=b.dataset.v; localStorage.setItem('forge_view',VIEW); loadRuns(); });
    bar.querySelectorAll('button[data-lvl]').forEach(b=>b.onclick=()=>{ BOARD_LEVEL=b.dataset.lvl; localStorage.setItem('forge_board_level',BOARD_LEVEL); loadRuns(); });
    list.appendChild(bar);
    if(!runs.length){ list.appendChild(el(`<div class="empty">No runs${ACTIVE_ORG?` for ${esc(ACTIVE_ORG)}`:''} yet.</div>`)); return; }
    const runById = Object.fromEntries(runs.map(r=>[r.id, r]));
    const epics = runs.filter(r=>r.kind==='epic');
    const epicItems = {};                            // fetch each epic's items once, used by both views
    await Promise.all(epics.map(async ep=>{ try{ epicItems[ep.id]=(await get(`/runs/${ep.id}/items`)).items||[]; }catch(e){ epicItems[ep.id]=[]; } }));
    if(VIEW==='board') renderBoard(list, runs, runById, epics, epicItems);
    else               renderTree(list, runs, runById, epics, epicItems, attn);
  }catch(e){ list.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function renderTree(list, runs, runById, epics, epicItems, attn){
  const pending = runs.filter(r=>r.status==='awaiting_approval');
  if(pending.length && attn){
    const card = el(`<div class="card" style="border:1px solid var(--accent);background:rgba(232,114,10,.06);padding:12px 14px;margin-bottom:14px">
      <div class="sec" style="margin:0 0 8px;color:var(--accent)">⏳ Needs your attention · ${pending.length}</div></div>`);
    pending.forEach(r=>{
      const row = el(`<div class="runrow${CUR===r.id?' sel':''}" data-id="${r.id}" style="border-radius:8px">
          <div class="dot d-${esc(r.status)}"></div>
          <div style="min-width:0;flex:1">
            <div class="rg">${esc(r.goal)}</div>
            <div class="rmeta">${esc(r.repo)} · click to review &amp; approve${r.parent_goal?' · ↳ '+esc(r.parent_goal.split('\n')[0].slice(0,34)):''}</div>
          </div></div>`);
      row.onclick = ()=>openRun(r.id);
      card.appendChild(row);
    });
    attn.appendChild(card);
  }
  const rest = runs.filter(r=>r.status!=='awaiting_approval');
  const eps = rest.filter(r=>r.kind==='epic');
  const standalone = rest.filter(r=>r.kind!=='epic' && !r.parent_id);
  for(const ep of eps){
    const items = epicItems[ep.id] || [];
    const open = EXPANDED.has(ep.id);              // epics default collapsed — click ▸ to see the steps
    const head = el(`<div class="runrow${CUR===ep.id?' sel':''}" data-id="${ep.id}" style="background:var(--panel2)">
        <div class="dot d-${esc(ep.status)}"></div>
        <div style="min-width:0;flex:1">
          <div class="rg"><span class="ecar">${open?'▾':'▸'}</span> ${esc(ep.goal.split('\n')[0].slice(0,56))}</div>
          <div class="rmeta">feature · ${esc(ep.status)} · ${items.length} step${items.length!==1?'s':''}</div>
        </div></div>`);
    head.querySelector('.ecar').onclick = (e)=>{ e.stopPropagation();
      if(open) EXPANDED.delete(ep.id); else EXPANDED.add(ep.id);
      localStorage.setItem('forge_expanded', JSON.stringify([...EXPANDED])); loadRuns(); };
    head.onclick = ()=>openRun(ep.id);
    list.appendChild(head);
    if(open) items.forEach(it=>{
      const rid = it.run_id;
      const st = (rid && runById[rid]) ? runById[rid].status : it.status;   // real child status
      const row = el(`<div class="runrow${CUR===rid?' sel':''}" data-id="${rid||''}" style="padding-left:34px">
          <div class="dot d-${esc(st)}"></div>
          <div style="min-width:0;flex:1">
            <div class="rg" style="font-size:12.5px">#${it.seq+1} ${esc(it.title.slice(0,58))}</div>
            <div class="rmeta">${esc(it.repo)} · ${esc(st)}${st==='awaiting_approval'?' — approve':''}${it.depends_on.length?' · after #'+it.depends_on.map(d=>d+1).join(', #'):''}${rid?'':' · not started'}</div>
          </div></div>`);
      if(rid) row.onclick = ()=>openRun(rid);
      list.appendChild(row);
    });
  }
  if(standalone.length){
    list.appendChild(el(`<div class="phhdr" style="padding-left:13px">Single changes</div>`));
    standalone.forEach(r=>{
      const row = el(`<div class="runrow${CUR===r.id?' sel':''}" data-id="${r.id}">
          <div class="dot d-${esc(r.status)}"></div>
          <div style="min-width:0">
            <div class="rg">${esc(r.goal)}</div>
            <div class="rmeta">${esc(r.status)}${r.phase?' · '+esc(r.phase):''} · ${esc((r.created_at||'').slice(5,16).replace('T',' '))}</div>
          </div></div>`);
      row.onclick = ()=>openRun(r.id);
      list.appendChild(row);
    });
  }
}

const PLAN_PHASES = ['plan','classify','decompose','assess','planning','spec'];
function bucketOf(st, phase){                       // map every run status+phase onto the four lanes
  if(st==='complete' || st==='rejected') return 'done';   // rejected is done — just not merged
  if(PLAN_PHASES.includes(phase)) return 'plan';          // still being scoped/decomposed
  if(!st || st==='pending' || st==='queued' || st==='not_started') return 'todo';
  return 'doing';   // running, build, verify, review, approve, awaiting_approval, blocked, failed, incomplete
}
function epicBucket(ep, items, runById){            // an epic's lane follows its steps' progress
  if(!items.length) return bucketOf(ep.status, ep.phase);
  const sts = items.map(it=>{ const cr=it.run_id&&runById[it.run_id]; return cr?cr.status:it.status; });
  if(sts.every(s=>s==='complete'||s==='rejected')) return 'done';
  if(sts.some(s=>s && !['pending','queued','not_started'].includes(s))) return 'doing';
  return 'todo';
}
function renderBoard(list, runs, runById, epics, epicItems){
  const cards = [];
  if(BOARD_LEVEL==='epic'){                          // one card per feature (epic)
    for(const ep of epics){
      const items = epicItems[ep.id]||[];
      const done = items.filter(it=>{ const cr=it.run_id&&runById[it.run_id]; const s=(cr?cr.status:it.status); return s==='complete'||s==='rejected'; }).length;
      cards.push({id:ep.id, title:ep.goal.split('\n')[0], repo:ep.repo, status:ep.status,
                  bucket:epicBucket(ep, items, runById),
                  meta:(items.length?`${done}/${items.length} steps`:'feature')});
    }
    for(const r of runs.filter(r=>r.kind!=='epic' && !r.parent_id))
      cards.push({id:r.id, title:r.goal.split('\n')[0], repo:r.repo, status:r.status,
                  bucket:bucketOf(r.status, r.phase), meta:(r.pr_url?'PR ✓':r.status==='rejected'?'rejected':'single change')});
  } else {                                           // one card per subtask
    for(const ep of epics){
      const eg = ep.goal.split('\n')[0].slice(0,32);
      for(const it of (epicItems[ep.id]||[])){
        const rid = it.run_id, cr = rid && runById[rid];
        const st = cr?cr.status:it.status, ph = cr?cr.phase:null;
        cards.push({id:rid, title:`#${it.seq+1} ${it.title}`, repo:it.repo, status:st,
                    bucket:bucketOf(st, ph),
                    meta:'↳ '+eg+(st==='awaiting_approval'?' · approve':'')+(st==='rejected'?' · rejected':'')+((cr&&cr.pr_url)?' · PR ✓':'')});
      }
    }
    for(const r of runs.filter(r=>r.kind!=='epic' && !r.parent_id))
      cards.push({id:r.id, title:r.goal.split('\n')[0], repo:r.repo, status:r.status,
                  bucket:bucketOf(r.status, r.phase), meta:(r.pr_url?'PR ✓':r.status==='rejected'?'rejected':'single change')});
  }
  const cols = {plan:[], todo:[], doing:[], done:[]};
  cards.forEach(c=>cols[c.bucket].push(c));
  const labels = {plan:'Plan', todo:'To do', doing:'In progress', done:'Done'};
  const board = el(`<div class="kanban"></div>`);
  ['plan','todo','doing','done'].forEach(k=>{
    const col = el(`<div class="kcol"><div class="khead">${labels[k]} · ${cols[k].length}</div></div>`);
    cols[k].forEach(c=>{
      const card = el(`<div class="kcard${CUR===c.id?' sel':''}">
          <div class="dot d-${esc(c.status)}"></div>
          <div style="min-width:0;flex:1">
            <div class="rg" style="font-size:12px">${esc(c.title.slice(0,58))}</div>
            <div class="rmeta">${esc(c.repo)}${c.meta?' · '+esc(c.meta):''}</div>
          </div></div>`);
      if(c.id) card.onclick = ()=>openRun(c.id);
      col.appendChild(card);
    });
    board.appendChild(col);
  });
  list.appendChild(board);
}

async function openRun(id){
  if(POLL){ clearInterval(POLL); POLL=null; }
  CUR = id; SEEN = 0; EVENTS = []; FILTER = 'all';
  document.querySelectorAll('.runrow').forEach(r=>r.classList.toggle('sel', r.dataset.id===id));
  await refreshRun(true);
  POLL = setInterval(async ()=>{
    const done = await refreshRun(false);
    if(done && POLL){ clearInterval(POLL); POLL=null; loadRuns(); }
  }, 1500);
}

async function refreshRun(full){
  if(!CUR) return true;
  let run, evs;
  try{
    [run, evs] = await Promise.all([get(`/runs/${CUR}`), get(`/runs/${CUR}/events`,{after:SEEN})]);
  }catch(e){ $('#rundetail').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return true; }
  if(evs.length){ EVENTS = EVENTS.concat(evs); SEEN = evs[evs.length-1].seq; }
  if(run.kind === 'epic'){
    try{ ITEMS = (await get(`/runs/${CUR}/items`)).items; }catch(e){ ITEMS = null; }
  }else{ ITEMS = null; }
  renderRun(run);
  return !['running','queued'].includes(run.status);
}

function renderRun(run){
  const isEpic = run.kind === 'epic';
  const TABLE = isEpic ? EPHASES : PHASES;
  const done = new Set(EVENTS.map(e=>e.phase).filter(Boolean));
  const active = run.phase;
  const running = ['running','queued'].includes(run.status);
  const order = TABLE.map(p=>p.key);
  const ai = order.indexOf(active);

  const steps = TABLE.map((p,i)=>{
    let cls = 'stp';
    if(!p.implemented) cls += ' future';
    if(p.key === active && running) cls += ' on';
    else if(done.has(p.key) && (ai < 0 || i < ai || !running)) cls += ' ok';
    return `<div class="${cls}" title="${esc(p.blurb)}${p.implemented?'':' — not built yet'}">
              <i></i><span>${esc(p.title)}</span></div>`;
  }).join('');

  const last = EVENTS[EVENTS.length-1];
  // A terminal run says what it actually ended as — never a bare "finished",
  // which is what made a run that stopped at Plan look like a completed one.
  const ENDED = {complete:'complete — pull request opened',
                 incomplete:'stopped — the road runs out here',
                 blocked:'blocked — it could not continue',
                 awaiting_approval:'waiting for your decision',
                 rejected:'rejected',
                 failed:'failed'};
  const nowText = running ? (last ? last.title : 'starting…')
                          : (ENDED[run.status] || run.status);
  const pill = {running:'b-medium', queued:'b-low', complete:'b-high',
                incomplete:'b-medium', blocked:'b-medium', done:'b-high',
                awaiting_approval:'b-medium', rejected:'b-low',
                failed:'b-low'}[run.status] || 'b-low';
  let ST = {};
  try{ ST = run.state ? (typeof run.state==='string'?JSON.parse(run.state):run.state) : {}; }catch(e){}
  const rv = ST.review || {};
  const diffs = (ST.reviewed && ST.reviewed.diffs) || [];
  const sevRank = {high:0,medium:1,low:2};
  const findingsHtml = (rv.findings||[]).length ? `
      <div class="sec" style="margin:12px 0 6px">Review · verdict <b>${esc(rv.verdict||'—')}</b> ·
        ${rv.findings.length} finding(s)
        <span class="muted" style="font-weight:400">${esc((rv.models||[]).join(', '))}${rv.verifier?' + verify':''}</span></div>
      <div class="list">${rv.findings.slice().sort((a,b)=>(sevRank[a.severity]??3)-(sevRank[b.severity]??3)).map(f=>`
        <div class="item" style="cursor:default"><span class="badge b-${esc(f.severity||'low')}">${esc(f.severity||'?')}</span>
          <div style="min-width:0;flex:1"><div class="qn" style="font-family:var(--mono)">${esc((f.file||'')+(f.line?':'+f.line:''))}</div>
          <div class="sig">${esc(f.detail||'')}</div></div></div>`).join('')}</div>`
    : (run.status==='awaiting_approval' && !isEpic ? '<div class="hint" style="margin:12px 0 0">No review findings.</div>' : '');
  const diffHtml = diffs.length ? `
      <div class="sec" style="margin:12px 0 6px">Diff · ${diffs.length} file(s)</div>
      ${diffs.map(d=>`<details style="margin-bottom:6px"><summary style="cursor:pointer"><code>${esc(d.path)}</code>
        <span style="color:var(--hi)">+${d.additions}</span> <span style="color:#f85149">−${d.deletions}</span></summary>
        <pre style="max-height:340px;overflow:auto;background:var(--panel2);padding:9px;border-radius:6px;font-size:12px;margin:6px 0 0">${esc((d.diff||'').slice(0,8000))}</pre></details>`).join('')}` : '';

  const gate = run.status === 'awaiting_approval' ? `
      <div class="gate">
        <div class="gt">${isEpic
          ? 'No code has been written yet. Approving the split runs each piece as its own change — and every one of them still stops for your review before its PR is opened.'
          : 'Nothing has been pushed. Review the findings and diff below, then Approve to open the PR, or send feedback to rebuild.'}</div>
        ${isEpic ? '' : findingsHtml + diffHtml + `
        <textarea id="fbk" placeholder="feedback for a revision (optional) — e.g. also handle the empty-string case, or rename X to Y"
          style="width:100%;box-sizing:border-box;min-height:64px;margin:12px 0 0;font:inherit;font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px"></textarea>`}
        <div class="row" style="margin:11px 0 0">
          <button class="go" id="okbtn">${isEpic?'Approve the split':'Approve &amp; open PR'}</button>
          ${isEpic?'':'<button class="go" id="revbtn" style="background:var(--med);color:#fff">Revise with feedback</button>'}
          <button class="go" id="nobtn"
                  style="background:#33383f;color:var(--ink2)">Reject</button>
        </div>
      </div>` : '';
  const prlink = run.pr_url ? `
      <div class="blocker" style="border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.08)">
        <div class="bt" style="color:var(--hi)">Pull request opened</div>
        <div class="ba"><a href="${esc(run.pr_url)}" target="_blank" rel="noopener">${esc(run.pr_url)} ↗</a></div>
      </div>` : '';
  const blocker = (!running && (run.stopped_reason || run.error)) ? `
      <div class="blocker">
        <div class="bt">${esc(run.stopped_reason || run.error)}</div>
        ${run.next_action?`<div class="ba"><b>Next:</b> ${esc(run.next_action)}</div>`:''}
      </div>` : '';

  const counts = {finding:0, warn:0, error:0};
  EVENTS.forEach(e=>{ if(e.level==='warn') counts.warn++; else if(e.level==='error') counts.error++;
                      else if(['finding','impact'].includes(e.kind)) counts.finding++; });

  $('#rundetail').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:6px">
        <h3 style="margin:0;flex:1;font-size:15px">${esc(run.goal)}</h3>
        <span class="badge ${pill}">${esc(run.status)}</span>
      </div>
      <div class="rmeta" style="margin-bottom:14px">
        ${esc(run.repo)}${run.target?' · target '+esc(run.target):''}
        · model ${esc(run.model || 'none')} · ${esc((run.created_at||'').replace('T',' ').replace('+00:00',''))}
      </div>
      ${run.parent_id?`<div class="note" style="display:flex;align-items:center;gap:10px;margin:0 0 12px">
        <span style="flex:1">↳ Part of feature: <b>${esc((run.parent_goal||'an epic').split('\n')[0].slice(0,70))}</b></span>
        <button class="go" style="padding:4px 10px;background:#e9edf3;color:var(--ink2)" onclick="openRun('${esc(run.parent_id)}')">Open feature</button>
      </div>`:''}
      <div class="stepper">${steps}</div>
      ${prlink}${gate}${blocker}
      <div class="now">
        <div class="dot d-${esc(run.status)}" style="margin:0"></div>
        <div><b>${esc(nowText)}</b></div>
        <div style="margin-left:auto;display:flex;gap:6px">
          ${counts.finding?`<span class="badge b-low">${counts.finding} findings</span>`:''}
          ${counts.warn?`<span class="badge b-medium">${counts.warn} warnings</span>`:''}
          ${counts.error?`<span class="badge b-low" style="color:#f85149">${counts.error} errors</span>`:''}
        </div>
      </div>
      ${isEpic ? itemsPanel(ITEMS) : ''}
      <div class="chips">
        ${[['all','Everything'],['finding','Findings only'],['problem','Warnings & errors']]
          .map(([k,l])=>`<button class="chip${FILTER===k?' on':''}" data-f="${k}">${l}</button>`).join('')}
      </div>
      <div class="list" id="tl"></div>
    </div>`;

  $('#rundetail').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    FILTER = c.dataset.f; renderRun(run); });

  const ok = $('#okbtn'), no = $('#nobtn');
  if(ok) ok.onclick = async ()=>{
    ok.disabled = no.disabled = true; ok.textContent = 'opening…';
    try{ await send('POST',`/runs/${run.id}/approve`); openRun(run.id); }
    catch(e){ alert(e.message); ok.disabled = no.disabled = false;
              ok.textContent = 'Approve & open PR'; }
  };
  if(no) no.onclick = async ()=>{
    const note = prompt('Why are you rejecting it? (optional)') ?? null;
    ok.disabled = no.disabled = true;
    try{ await send('POST',`/runs/${run.id}/reject`,{note}); openRun(run.id); }
    catch(e){ alert(e.message); ok.disabled = no.disabled = false; }
  };
  const rev = $('#revbtn');
  if(rev) rev.onclick = async ()=>{
    const note = ($('#fbk')?.value || '').trim();
    if(!note){ $('#fbk')?.focus(); return; }
    rev.disabled = ok.disabled = no.disabled = true; rev.textContent = 'rebuilding…';
    try{ const r = await send('POST',`/runs/${run.id}/revise`,{note}); openRun(r.new_run); }
    catch(e){ alert(e.message); rev.disabled = ok.disabled = no.disabled = false;
              rev.textContent = 'Revise with feedback'; }
  };

  const tl = $('#tl');
  const shown = EVENTS.filter(e =>
    FILTER==='all' ? true :
    FILTER==='finding' ? ['finding','impact','plan','metric'].includes(e.kind) :
    ['warn','error'].includes(e.level));
  if(!shown.length){ tl.innerHTML = '<div class="empty">nothing here yet</div>'; return; }

  let lastPhase = '\0';
  shown.forEach(e=>{
    if(e.phase !== lastPhase){
      const p = TABLE.find(x=>x.key===e.phase);
      tl.appendChild(el(`<div class="phhdr">${esc(p?p.title:(e.phase||'run'))}</div>`));
      lastPhase = e.phase;
    }
    const [g,col] = GLYPH[e.kind] || GLYPH.info;
    const pv = preview(e.detail);
    const row = el(`<div class="ev2 lv-${esc(e.level||'info')}">
        <div class="gl" style="color:${col}">${g}</div>
        <div style="min-width:0;flex:1">
          <div class="tt">${esc(e.title)}</div>
          ${pv?`<div class="pv">${esc(pv)}</div>`:''}
        </div>
        <div class="tm">${esc((e.ts||'').slice(11,19))}</div>
      </div>`);
    tl.appendChild(row);
    if(e.detail != null){
      const b = el(`<div class="body" hidden>${body(e.detail)}</div>`);
      tl.appendChild(b);
      row.onclick = ()=>{ b.hidden = !b.hidden; };
    }
  });
}

/* ── repo memory ──────────────────────────────────────────────────── */
async function loadMemory(){
  const box = $('#memory');
  box.innerHTML = '<div class="spin">…</div>';
  let d;
  try{ d = await get('/memory'); }
  catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  box.innerHTML = `<div class="hint">What the coder already knows about each repo.
    Conventions are read from the repo's own AGENTS.md / CLAUDE.md, lessons are captured
    when you reject a change, gotchas when a build trips over something. All of it is
    injected into the next run's planning and building prompts.</div>`;

  box.appendChild(el(`<div class="card" style="margin-bottom:16px">
      <div class="row" style="margin:0">
        <select id="mrepo">${REPOS.map(r=>`<option>${esc(r.name)}</option>`).join('')}</select>
        <select id="mkind">${d.kinds.map(k=>`<option>${esc(k)}</option>`).join('')}</select>
        <input id="mtitle" placeholder="short title — what it is">
        <input id="mbody" placeholder="the rule, in one or two sentences" style="flex:2">
        <button class="go" id="msave2">Remember</button>
        <button class="go" id="mprev" style="background:#33383f;color:var(--ink2)">Preview prompt</button>
      </div>
      <div id="mpv" class="hint" style="margin:11px 0 0"></div>
    </div>`));
  $('#msave2').onclick = async ()=>{
    const b = {repo:$('#mrepo').value, kind:$('#mkind').value,
               title:$('#mtitle').value.trim(), body:$('#mbody').value.trim()};
    if(!b.title||!b.body){ alert('title and body are required'); return; }
    try{ await send('POST','/memory',b); loadMemory(); }catch(e){ alert(e.message); }
  };
  $('#mprev').onclick = async ()=>{
    const p = $('#mpv'); p.textContent = 'loading…';
    try{
      const r = await get('/memory/preview',{repo:$('#mrepo').value});
      p.innerHTML = r.text
        ? `<pre style="white-space:pre-wrap;font-size:11.5px;color:var(--ink2);margin:0">${esc(r.text)}</pre>`
        : 'Nothing is remembered for this repo yet, so nothing would be injected.';
    }catch(e){ p.textContent = e.message; }
  };

  const byRepo = {};
  d.memories.forEach(m=>(byRepo[m.repo] ||= []).push(m));
  if(!d.memories.length){
    box.appendChild(el('<div class="list"><div class="empty">Nothing remembered yet. Run the coder once — it reads the repo\'s own conventions on the way through.</div></div>'));
    return;
  }
  Object.entries(byRepo).forEach(([repo, items])=>{

    const list = el('<div class="list"></div>');

          <span class="mk mk-${esc(m.kind)}">${esc(m.kind)}</span>

            <div style="font-size:13px">${esc(m.title)}</div>
            <div class="mb">${esc(m.body)}</div>
          </div>
          <div class="mx">

/* ── pull requests ────────────────────────────────────────────────── */
function ago(iso){
  if(!iso) return '';
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(s < 3600) return Math.round(s/60)+'m';
  if(s < 86400) return Math.round(s/3600)+'h';
  return Math.round(s/86400)+'d';
}

async function loadPRs(){
  const box = $('#prs');
  box.innerHTML = '<div class="spin">asking GitHub…</div>';
  let d;
  try{ d = await get('/prs', {org: ACTIVE_ORG}); }   // scoped by the header org switcher
  catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  box.innerHTML = '';
  box.appendChild(el(`<div class="hint" style="margin-bottom:12px">Showing
    <b>${ACTIVE_ORG?esc(ACTIVE_ORG):'all orgs'}</b> · switch worlds with the selector
    in the top bar.</div>`));

  if(d.why){
    box.appendChild(el(`<div class="blocker"><div class="bt">${esc(d.why)}</div>
      <div class="ba"><b>Note:</b> forge only ever uses the READ token here — listing
      and reading pull requests cannot approve, merge, comment or push.</div></div>`));
  }
  if(d.repos?.length){
    box.appendChild(el(`<div class="hint">watching ${d.repos.length} repo(s):
      <code>${esc(d.repos.join(', '))}</code></div>`));
  }
  (d.errors||[]).forEach(e=>box.appendChild(
    el(`<div class="note">${esc(e.repo)}: ${esc(e.error)}</div>`)));

  if(!d.prs?.length){
    box.appendChild(el('<div class="list"><div class="empty">No open pull requests.</div></div>'));
    return;
  }

  // ordering: by app (grouped), by number, or most-recent (backend order)
  const bar = el('<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">'
    + '<span class="muted" style="font-size:12px">Order:</span></div>');
  [['app','by app'],['number','by number'],['recent','recent']].forEach(([k,label])=>{
    const on = PR_SORT===k;
    const b = el(`<button style="border:1px solid var(--line);border-radius:999px;padding:4px 11px;
      cursor:pointer;font:inherit;font-size:12px;background:${on?'var(--accent)':'var(--panel2)'};
      color:${on?'#fff':'var(--ink)'}">${label}</button>`);
    b.onclick = ()=>{ PR_SORT=k; localStorage.setItem('forge_prsort',k); loadPRs(); };
    bar.appendChild(b);
  });
  box.appendChild(bar);

  const mkRow = (p)=>{
    const row = el(`<div class="item">
        <span class="kind">#${p.number}</span>
        <div style="min-width:0;flex:1">
          <div class="qn">${esc(p.title)}</div>
          <div class="sig">${esc(p.repo)} · ${esc(p.author||'?')} ·
            <code>${esc(p.head||'')}</code> → <code>${esc(p.base||'')}</code>
            ${p.draft?' · draft':''}${p.indexed_as?'':' · not indexed locally'}</div>
        </div>
        <div class="loc">${esc(ago(p.updated_at))} ago</div>
      </div>`);
    const det = el('<div class="body" hidden><div class="spin">loading…</div></div>');
    let loaded = false;
    row.onclick = async ()=>{
      det.hidden = !det.hidden;
      if(loaded || det.hidden) return;
      loaded = true;
      try{
        const [owner, name] = p.repo.split('/');
        det.innerHTML = prBody(await get(`/prs/${owner}/${name}/${p.number}`));
        wireReview(det.querySelector('[data-rev]'), owner, name, p.number);
      }catch(e){ det.innerHTML = `<span class="badge b-low">failed</span> ${esc(e.message)}`; loaded=false; }
    };
    return [row, det];
  };

  if(PR_SORT==='app'){
    const byRepo = {};
    d.prs.forEach(p=>{ (byRepo[p.repo]=byRepo[p.repo]||[]).push(p); });
    Object.keys(byRepo).sort().forEach(repo=>{
      box.appendChild(el(`<div class="sec">${esc(repo.split('/')[1]||repo)} · ${byRepo[repo].length} open`
        + `<span class="muted" style="font-weight:400"> · ${esc(repo)}</span></div>`));
      const list = el('<div class="list"></div>');
      byRepo[repo].sort((a,b)=>b.number-a.number).forEach(p=>{ const [r,dt]=mkRow(p); list.appendChild(r); list.appendChild(dt); });
      box.appendChild(list);
    });
  }else{
    const prs = d.prs.slice();
    if(PR_SORT==='number') prs.sort((a,b)=>b.number-a.number);
    box.appendChild(el(`<div class="sec">Open pull requests · ${prs.length}</div>`));
    const list = el('<div class="list"></div>');
    prs.forEach(p=>{ const [r,dt]=mkRow(p); list.appendChild(r); list.appendChild(dt); });
    box.appendChild(list);
  }
}

function prBody(d){
  const imp = d.impact || {};
  let impHtml;
  if(!imp.available){
    impHtml = `<div class="muted">${esc(imp.why||'impact unavailable')}</div>`;
  }else if(!imp.reaches?.length){
    impHtml = `<div class="muted">No cross-repo impact found across
      ${imp.checked} checked file(s).</div>`;
  }else{
    impHtml = imp.reaches.map(r=>`
      <div style="margin-bottom:9px">
        <span class="badge b-${esc(r.confidence)}">${esc(r.confidence)}</span>
        <b style="font-family:var(--mono)">${esc(r.repo)}</b>
        <span class="muted">via ${esc(r.files.join(', '))}</span>
        ${r.evidence.map(e=>`<div class="muted" style="font-family:var(--mono);font-size:11px;margin-left:4px">
            ${esc(e.signal)}: ${esc(e.their_path||e.name||'')} — ${esc(e.file||'')}:${esc(e.line||'')}
          </div>`).join('')}
      </div>`).join('');
  }
  const files = (d.files||[]).slice(0,60).map(f=>
    `<tr><td>${esc(f.status)}</td><td>${esc(f.path)}</td>
      <td style="color:var(--hi)">+${f.additions}</td>
      <td style="color:#f85149">−${f.deletions}</td></tr>`).join('');
  return `
    <div data-rev style="margin-bottom:14px"></div>
    <div style="margin-bottom:12px">
      <div class="sec" style="margin-top:0">Reaches other repos</div>
      ${impHtml}
    </div>
    <div class="sec">Changed files (${d.changed_files ?? (d.files||[]).length}) ·
      <span style="color:var(--hi)">+${d.additions??'?'}</span>
      <span style="color:#f85149">−${d.deletions??'?'}</span></div>
    <table>${files}</table>
    ${d.body?`<div class="sec">Description</div><div class="prose">${esc(d.body.slice(0,3000))}</div>`:''}
    <div style="margin-top:12px"><a href="${esc(d.url)}" target="_blank" rel="noopener">open on GitHub ↗</a></div>`;
}

/* ── PR review: draft (read-only) → edit → post (the gated write path) ─── */
function wireReview(slot, owner, repo, number){
  if(!slot) return;
  slot.innerHTML = `
    <button class="go" data-mode="light">Light review</button>
    <button class="go" data-mode="full" style="background:#33383f;color:#fff">Full review</button>
    <span class="muted" style="margin-left:8px;font-size:12px">light = one pass · full =
    multi-model finders + adversarial verify (~1–2 min). Reads the diff, forge's cross-repo
    impact and prior comments. Read-only until you Post.</span>`;
  slot.querySelectorAll('[data-mode]').forEach(b=>b.onclick = async ()=>{
    const mode = b.dataset.mode;
    slot.querySelectorAll('[data-mode]').forEach(x=>x.disabled = true);
    b.textContent = 'starting…';
    let r;
    try{ r = await send('POST', `/prs/${owner}/${repo}/${number}/review?mode=${mode}`); }
    catch(e){ slot.innerHTML = `<div class="note">review failed: ${esc(e.message)}</div>
      <button class="go" onclick="wireReview(this.closest('[data-rev]'),'${owner}','${repo}',${number})">try again</button>`; return; }
    reviewRun(slot, owner, repo, number, r.run_id, mode);
  });
}

/* Live task view for a review run — polls the run's events and shows each step
   as it happens, then renders the draft + Post when the result arrives. */
async function reviewRun(slot, owner, repo, number, runId, mode){
  slot.innerHTML = `<div class="sec" style="margin-top:0;display:flex;align-items:center;gap:8px">
      <span>forge ${esc(mode)} review · <span class="muted" id="rvstat">running…</span></span>
      <button class="go" style="margin-left:auto;background:#e9edf3;color:var(--ink2);padding:4px 10px"
        onclick="wireReview(this.closest('[data-rev]'),'${owner}','${repo}',${number})">Cancel</button>
    </div>
    <div class="list" id="rvlog"></div>`;
  const log = slot.querySelector('#rvlog');
  let seen = 0, finished = false;
  const step = async ()=>{
    let run, evs;
    try{ [run, evs] = await Promise.all([get(`/runs/${runId}`), get(`/runs/${runId}/events`,{after:seen})]); }
    catch(e){ return true; }
    for(const e of evs){
      seen = e.seq;
      if(e.kind==='result'){
        const rd = el('<div style="margin-top:14px"></div>');
        slot.appendChild(rd);
        renderReview(rd, owner, repo, number, e.detail);
        finished = true;
      }else if(e.kind==='error'){
        log.appendChild(el(`<div class="note">${esc(e.title||'failed')}</div>`));
      }else{
        log.appendChild(el(`<div class="item" style="cursor:default">
          <span class="kind">${esc(e.phase||'')}</span>
          <div style="min-width:0;flex:1"><div class="sig">${esc(e.title||'')}</div></div>
          <div class="loc">${esc((e.ts||'').slice(11,19))}</div></div>`));
      }
    }
    const st = slot.querySelector('#rvstat'); if(st) st.textContent = finished?'done':run.status;
    return finished || !['running','queued'].includes(run.status);
  };
  if(await step()) return;
  const iv = setInterval(async ()=>{ if(await step()) clearInterval(iv); }, 1200);
}

function renderReview(slot, owner, repo, number, r){
  const findings = r.findings || [];
  const sev = findings.reduce((a,f)=>{const s=(f.severity||'low');a[s]=(a[s]||0)+1;return a;},{});
  slot.innerHTML = '';
  const prov = `${esc(r.mode||'')} check`
    + (r.models?.length?` · ${esc(r.models.join(', '))}`:'')
    + (r.verifier?` + verify(${esc(r.verifier)})`:'')
    + (r.prior_comments?` · ${r.prior_comments} prior comment(s)`:'');
  const head = el(`<div class="sec" style="margin-top:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span>forge review · <span class="muted" style="font-weight:400">${prov}</span>
    · verdict: <b>${esc(r.verdict||'—')}</b> · ${findings.length} finding(s)
    ${Object.entries(sev).map(([s,n])=>`<span class="badge b-${esc(s)}">${n} ${esc(s)}</span>`).join(' ')}</span>
    <button class="go" style="margin-left:auto;background:#e9edf3;color:var(--ink2);padding:4px 10px"
      onclick="wireReview(this.closest('[data-rev]'),'${owner}','${repo}',${number})">New review</button>
  </div>`);
  slot.appendChild(head);
  if(findings.length){
    const fl = el('<div class="list" style="margin-bottom:10px"></div>');
    findings.forEach(f=>fl.appendChild(el(`<div class="item" style="cursor:default">
      <span class="badge b-${esc(f.severity||'low')}">${esc(f.severity||'?')}</span>
      <div style="min-width:0;flex:1">
        <div class="qn" style="font-family:var(--mono)">${esc((f.file||'')+(f.line?':'+f.line:''))}</div>
        <div class="sig">${esc(f.detail||'')}</div></div></div>`)));
    slot.appendChild(fl);
  }
  slot.appendChild(el('<div class="sec">Draft comment — edit before posting</div>'));
  const ta = el(`<textarea style="width:100%;min-height:200px;font:inherit;font-size:13px;
    background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:10px;box-sizing:border-box"></textarea>`);
  ta.value = r.draft || '';
  slot.appendChild(ta);
  const bar = el('<div class="row" style="margin:10px 0 0;align-items:center"></div>');
  const post = el('<button class="go">Post comment to GitHub</button>');
  const copy = el('<button class="go" style="background:#e9edf3;color:var(--ink2)">Copy</button>');
  const res = el('<span class="muted" style="margin-left:10px;font-size:12.5px"></span>');
  copy.onclick = ()=>{ navigator.clipboard?.writeText(ta.value); res.textContent = 'copied'; };
  post.onclick = async ()=>{
    if(!confirm(`Post this comment to ${owner}/${repo}#${number} on GitHub?`)) return;
    post.disabled = true; res.textContent = 'posting…';
    try{
      const o = await send('POST', `/prs/${owner}/${repo}/${number}/comment`, {body: ta.value});
      res.innerHTML = `<span class="badge b-high">posted</span>
        <a href="${esc(o.url)}" target="_blank" rel="noopener">view on GitHub ↗</a>`;
      post.textContent = 'posted';
    }catch(e){ res.innerHTML = `<span class="badge b-low">failed</span> ${esc(e.message)}`; post.disabled = false; }
  };
  bar.appendChild(post); bar.appendChild(copy); bar.appendChild(res);
  slot.appendChild(bar);
}

async function loadActivity(){
  const box = $('#activity');

    <div class="sec" style="margin-top:0">Activity${ACTIVE_ORG?` · ${esc(ACTIVE_ORG)}`:''}</div>
    <div class="hint" style="margin-bottom:14px">Everything running or recently run — builds, reviews and

function openAct(id){
  ACT_OPEN = id; ACT_SEEN = 0;
  const d = $('#actdetail'); if(d) d.innerHTML = '';
  refreshActivity();
}

// jump to the Build tab and open a run's gate (where diff + findings + Approve live)
function goApprove(id){
  const b = document.querySelector('nav button[data-tab="coder"]');
  if(b) b.click();
  setTimeout(()=>openRun(id), 80);
}

async function refreshActivity(){
  const rows = $('#actrows'); if(!rows) return;              // tab left
  let runs;
  try{ runs = await get('/runs',{limit:40}); }catch(e){ return; }
  if(ACTIVE_ORG){ const names = new Set(REPOS.map(r=>r.name)); runs = runs.filter(x=>names.has(x.repo)); }
  const kindLabel = r => r.kind==='review' ? 'review' : (r.kind==='epic' ? 'epic' : 'build');
  const mkRow = (r)=>{
    const row = el(`<div class="item${ACT_OPEN===r.id?' sel':''}" style="cursor:pointer">
      <span class="dot d-${esc(r.status)}"></span>
      <div style="min-width:0;flex:1">
        <div class="qn">${esc(r.goal)}</div>
        <div class="sig">${kindLabel(r)} · ${esc(r.repo)} · ${esc(r.status)}${r.phase?' · '+esc(r.phase):''}${r.parent_goal?' · ↳ '+esc(r.parent_goal.split('\n')[0].slice(0,32)):''}</div>
      </div>
      <div class="loc">${esc(ago(r.updated_at||r.created_at))} ago</div></div>`);
    row.onclick = ()=> r.status==='awaiting_approval' ? goApprove(r.id) : openAct(r.id);
    return row;
  };
  rows.innerHTML = '';
  if(!runs.length){ rows.innerHTML = '<div class="empty">No tasks yet — start one in Build.</div>'; }
  [['Waiting for you', runs.filter(r=>r.status==='awaiting_approval')],
   ['Running', runs.filter(r=>['running','queued'].includes(r.status))],
   ['Recent', runs.filter(r=>!['awaiting_approval','running','queued'].includes(r.status)).slice(0,12)]
  ].forEach(([label, group])=>{
    if(!group.length) return;
    rows.appendChild(el(`<div class="sec" style="margin:4px 0 6px">${label} · ${group.length}</div>`));
    const list = el('<div class="list" style="margin-bottom:12px"></div>');
    group.forEach(r=>list.appendChild(mkRow(r)));
    rows.appendChild(list);
  });
  if(!ACT_OPEN) return;
  let run, evs;
  try{ [run, evs] = await Promise.all([get(`/runs/${ACT_OPEN}`), get(`/runs/${ACT_OPEN}/events`,{after:ACT_SEEN})]); }
  catch(e){ return; }
  let det = $('#actstream');
  if(!det){
    $('#actdetail').innerHTML = `<div class="sec">${esc(run.goal)} · <span class="muted" id="actst">${esc(run.status)}</span></div>`
      + `<div class="list" id="actstream"></div>`;
    det = $('#actstream');
  }
  const st = $('#actst'); if(st) st.textContent = run.status + (run.phase?' · '+run.phase:'');
  evs.forEach(e=>{
    ACT_SEEN = e.seq;
    det.appendChild(el(`<div class="item" style="cursor:default">
      <span class="kind">${esc(e.phase||e.kind||'')}</span>
      <div style="min-width:0;flex:1"><div class="sig">${esc(e.title||'')}</div></div>
      <div class="loc">${esc((e.ts||'').slice(11,19))}</div></div>`));
    if(e.kind==='result' && e.detail && e.detail.draft)
      det.appendChild(el(`<div class="note" style="white-space:pre-wrap;font-size:12.5px">${esc(e.detail.draft)}</div>`));
  });
}

/* ── settings: credentials + models ───────────────────────────────── */
const PROVIDERS = ['github','anthropic','openai','openai-compatible','ollama','claude-cli'];
const ROLES = ['engineer','council','judge','fast'];

async function send(method, path, body){
  const r = await fetch(new URL(API+path, location.href), {
    method, headers:{'Content-Type':'application/json'},
    body: body?JSON.stringify(body):undefined });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

function verdict(res){
  const bits = [];
  if(res.ok) bits.push(`<span class="badge b-high">ok</span> ${esc(res.detail||'')}`);
  else bits.push(`<span class="badge b-low">failed</span> ${esc(res.detail||'')}`);
  if(res.scopes?.length) bits.push(`<div class="muted" style="margin-top:5px">scopes: <code>${esc(res.scopes.join(', '))}</code></div>`);
  (res.warnings||[]).forEach(w=>bits.push(`<div class="note">${esc(w)}</div>`));
  return bits.join('');
}

          <input id="mi" placeholder="model id" style="min-width:170px">
          <select id="mk"><option value="">— credential —</option>${keyOpts}</select>
          <select id="mr"><option value="">— role —</option>${ROLES.map(r=>`<option>${r}</option>`).join('')}</select>
          <input id="mb" placeholder="base url (optional)" style="min-width:150px">
          <button class="go" id="mfetch" style="background:#33383f;color:var(--ink2)">List models</button>
          <button class="go" id="msave">Add</button>
        </div>
        <div id="mhint" class="hint" style="margin:10px 0 0"></div>
      </div>`));
    $('#mfetch').onclick = async ()=>{
      const h=$('#mhint'); h.textContent='asking the provider…';
      try{
        const r = await get(`/providers/${$('#mp').value}/models`,
                            {secret_key:$('#mk').value, base_url:$('#mb').value});
        h.innerHTML = r.models.length
          ? `${r.models.length} available — click one to fill: ` + r.models.slice(0,40)
              .map(m=>`<a href="#" data-m="${esc(m)}"><code>${esc(m)}</code></a>`).join(' · ')
          : 'provider returned no models';
        h.querySelectorAll('a').forEach(a=>a.onclick=e=>{
          e.preventDefault(); $('#mi').value = a.dataset.m; });
      }catch(e){ h.textContent = e.message; }
    };
    $('#msave').onclick = async ()=>{
      const b = {name:$('#mn').value.trim(), provider:$('#mp').value,
                 model_id:$('#mi').value.trim(), base_url:$('#mb').value.trim()||null,
                 secret_key:$('#mk').value||null, role:$('#mr').value||null};
      if(!b.name||!b.model_id){ alert('name and model id are required'); return; }
      try{ await send('POST','/models',b); loadSettings(); }catch(e){ alert(e.message); }
    };
  }catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function secretCard(s){
  const c = el(`<div class="card">
      <h3>${esc(s.key)} ${s.set?'<span class="badge b-high">set</span>':'<span class="badge b-low">not set</span>'}</h3>
      <div class="muted" style="font-size:12.5px;margin-bottom:11px">${esc(s.label||'')}</div>
      ${s.set?`<div class="kv"><span>value</span><span>${esc(s.hint||'')}</span></div>
               <div class="kv"><span>updated</span><span>${esc((s.updated_at||'').replace('T',' ').replace('+00:00',''))}</span></div>`:''}
      <div class="row" style="margin:11px 0 0">
        <input class="val" type="password" placeholder="${s.set?'replace value…':'paste value…'}">
        <button class="go save" style="padding:7px 13px">Save</button>
        ${s.set?'<button class="go ver" style="padding:7px 13px;background:#33383f;color:var(--ink2)">Verify</button>':''}
        ${s.set&&!s.wellknown?'<button class="go rm" style="padding:7px 13px;background:#33383f;color:var(--ink2)">Delete</button>':''}
      </div>
      <div class="res" style="margin-top:10px;font-size:12.5px"></div>
    </div>`);
  const res = c.querySelector('.res');
  c.querySelector('.save').onclick = async ()=>{
    const v = c.querySelector('.val').value;
    if(!v) return;
    try{ await send('PUT','/settings',{key:s.key, value:v, provider:s.provider}); loadSettings(); }
    catch(e){ res.innerHTML = `<span class="badge b-low">failed</span> ${esc(e.message)}`; }
  };
  c.querySelector('.ver')?.addEventListener('click', async ()=>{
    res.innerHTML = 'checking…';
    try{ res.innerHTML = verdict(await send('POST',`/settings/${encodeURIComponent(s.key)}/verify`)); }
    catch(e){ res.innerHTML = `<span class="badge b-low">failed</span> ${esc(e.message)}`; }
  });
  c.querySelector('.rm')?.addEventListener('click', async ()=>{
    if(!confirm(`Delete ${s.key}?`)) return;
    await send('DELETE',`/settings/${encodeURIComponent(s.key)}`); loadSettings();
  });
  if(s.meta) res.innerHTML = verdict(s.meta);
  return c;
}
